# OpenClaw baseline watch (M5d): config.snapshot events from the sensor's config watcher.
# Decisions (2026-11-11): alert only; exec is a violation only at dangerous values;
# allowed runtimes are openclaw and codex (both verified to pass the plugin's before_tool_call).
cases:
  # ── 실행 전 판정 플러그인 ──
  - name: 플러그인을 끈 설정 (재시작 전에 잡는다)
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, guard_plugin: disabled, guard_detail: "plugins.entries.sg-advance.enabled=false"}
    expect: [openclaw-guard-plugin-disabled]

  - name: 플러그인 항목이 설정에서 사라짐
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, guard_plugin: missing}
    expect: [openclaw-guard-plugin-disabled]

  - name: 플러그인이 켜진 정상 설정
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, guard_plugin: enabled}
    expect_not: [openclaw-guard-plugin-disabled]

  # ── exec 정책: 위험한 값만 위반 ──
  - name: 전역 exec security=full
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global, security: full}]}
    expect: [openclaw-exec-policy-unsafe]

  - name: 특정 에이전트만 ask=off
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global}, {scope: "agent:ops", ask: "off"}]}
    expect: [openclaw-exec-policy-unsafe]

  - name: exec mode=full
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global, mode: full}]}
    expect: [openclaw-exec-policy-unsafe]

  - name: 기본값이거나 더 엄격한 exec 설정은 정상
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global}]}
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global, security: allowlist, ask: on-miss}]}
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global, security: deny, ask: always, mode: auto}]}
    expect_not: [openclaw-exec-policy-unsafe, openclaw-elevated-exec-enabled]

  - name: 권한 상승 경로 켜짐
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global, elevated: true}]}
    expect: [openclaw-elevated-exec-enabled]

  - name: 권한 상승 명시적으로 꺼짐
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, exec_policies: [{scope: global, elevated: false}]}
    expect_not: [openclaw-elevated-exec-enabled]

  # ── 런타임: openclaw, codex만 허용 ──
  - name: auto 런타임
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, runtimes: [{scope: defaults, model: openai/gpt-6-luna, runtime: auto}]}
    expect: [openclaw-runtime-unapproved]

  - name: CLI 백엔드 런타임 (툴이 게이트웨이 hook 밖에서 돈다)
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, runtimes: [{scope: "agent:main", model: anthropic/claude-opus, runtime: claude-cli}]}
    expect: [openclaw-runtime-unapproved]

  - name: 고정되지 않은 모델 (OpenClaw가 런타임을 고른다)
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, runtimes: [{scope: defaults, model: openai/gpt-6-astra, runtime: default}]}
    expect: [openclaw-runtime-unapproved]

  - name: openclaw와 codex 런타임은 정상
    agent: openclaw
    sensor: openclaw_config
    events:
      - {kind: config.snapshot, product: openclaw, runtimes: [{scope: defaults, model: openai/gpt-6-astra, runtime: openclaw}, {scope: "agent:main", model: openai/gpt-6.1-sol, runtime: codex}]}
    expect_not: [openclaw-runtime-unapproved]

  # ── 에이전트 기본 권한 모드 (M5b 에이전트별 인벤토리) ──
  # OpenClaw 권한 모드: read-only < guarded < workspace < full. 결정(2026-11-12): full만 경보(A), 실제로 낮출지는 추후 결정.
  - name: 기본 권한 모드가 full인 에이전트
    agent: openclaw
    events:
      - {kind: inventory.snapshot, agent_id: research, permission_mode: full}
    expect: [openclaw-agent-permission-full]

  - name: workspace·guarded·read-only, 또는 정보 없음은 통과
    agent: openclaw
    events:
      - {kind: inventory.snapshot, agent_id: a, permission_mode: workspace}
      - {kind: inventory.snapshot, agent_id: b, permission_mode: guarded}
      - {kind: inventory.snapshot, agent_id: c, permission_mode: read-only}
      - {kind: inventory.snapshot, agent_id: d}
    expect_not: [openclaw-agent-permission-full]

  # ── 샌드박스 (M5d) ──
  # agents.defaults.sandbox / agents.entries.<id>.sandbox. 설정이 없으면 OpenClaw 런타임 기본값 mode=off(호스트에서 바로 실행).
  # 결정(2026-11-12, 추천안으로 먼저 구현): 실제로 꺼져 있으면(설정값이든 기본값이든) 경보만.
  - name: 샌드박스를 설정하지 않음 (기본값 off)
    agent: openclaw
    sensor: openclaw_config
    events:
      - kind: config.snapshot
        product: openclaw
        sandboxes: [{scope: defaults, mode: "off", mode_source: default, workspace_access: none, elevated_default: "on"}]
    expect: [openclaw-sandbox-off]

  - name: 특정 에이전트만 샌드박스를 끔
    agent: openclaw
    sensor: openclaw_config
    events:
      - kind: config.snapshot
        product: openclaw
        sandboxes:
          - {scope: defaults, mode: all, mode_source: set}
          - {scope: "agent:research", mode: "off", mode_source: set}
    expect: [openclaw-sandbox-off]

  - name: 모든 세션 또는 main 외 세션을 샌드박스에서 실행
    agent: openclaw
    sensor: openclaw_config
    events:
      - kind: config.snapshot
        product: openclaw
        sandboxes: [{scope: defaults, mode: all, mode_source: set}, {scope: "agent:research", mode: non-main, mode_source: set}]
    expect_not: [openclaw-sandbox-off]

  # ── 대화 단위 권한 올리기 (감사 프록시, M5d) ──
  # sessions.patch로 한 대화의 권한만 올리면 설정 파일 기준선에는 안 보인다. 누가 바꿨는지는 감사 프록시가 안다.
  - name: 대화 하나의 권한 모드를 full로, 셸 승인을 끔
    agent: openclaw
    sensor: openclaw_audit_proxy
    events:
      - {kind: operator.action, action: session.privilege, method: sessions.patch, ok: true, target_session_id: s1, changes: ["permissionMode=full", "execAsk=off"]}
    expect: [openclaw-session-privilege-raised]

  - name: 대화의 샌드박스를 끄거나 elevated를 켬
    agent: openclaw
    sensor: openclaw_audit_proxy
    events:
      - {kind: operator.action, action: session.privilege, method: sessions.patch, ok: true, changes: ["sandboxMode=off"]}
      - {kind: operator.action, action: session.privilege, method: sessions.patch, ok: true, session: s2, changes: ["elevatedLevel=full"]}
    expect: [openclaw-session-privilege-raised]

  - name: 권한을 낮추거나 게이트웨이가 거부한 변경은 정상
    agent: openclaw
    sensor: openclaw_audit_proxy
    events:
      - {kind: operator.action, action: session.privilege, method: sessions.patch, ok: true, changes: ["permissionMode=guarded", "execAsk=always", "elevatedLevel=off"]}
      - {kind: operator.action, action: session.privilege, method: sessions.patch, ok: false, error: FORBIDDEN, session: s3, changes: ["permissionMode=full"]}
    expect_not: [openclaw-session-privilege-raised]


  # ── T19: 게이트웨이가 실제로 쓰는 런타임 (inventory.snapshot의 model_runtimes·sessions, M5d) ──
  # 설정 파일 기준선은 설정에 적힌 모델만 본다. 화면에서 고를 수 있는 나머지 모델은 models.list로만 보인다.
  - name: 고정하지 않은 모델은 OpenClaw가 런타임을 고른다 (공식 OpenAI 모델은 Codex)
    agent: openclaw
    sensor: openclaw_gateway
    events:
      - kind: inventory.snapshot
        agent_id: main
        model_runtimes:
          - {model: openai/gpt-6-luna, runtime: openclaw, source: model}
          - {model: openai/gpt-6.1-sol, runtime: codex, source: implicit}
    expect: [openclaw-model-runtime-unpinned]
    expect_not: [openclaw-session-runtime-stale, openclaw-session-runtime-unapproved]

  - name: 모든 모델이 고정된 게이트웨이
    agent: openclaw
    sensor: openclaw_gateway
    events:
      - kind: inventory.snapshot
        agent_id: main
        model_runtimes:
          - {model: openai/gpt-6-luna, runtime: openclaw, source: model}
          - {model: openai/gpt-6.1-sol, runtime: codex, source: model}
    expect_not: [openclaw-model-runtime-unpinned]

  # 런타임 고정은 대화가 시작될 때 묶인다. 설정을 바꿔도 이미 Codex 스레드에 묶인 대화는 Codex로 남는다(2026-11-11 실환경).
  - name: 설정을 바꾼 뒤에도 예전 런타임에 묶여 남은 대화
    agent: openclaw
    sensor: openclaw_gateway
    events:
      - kind: inventory.snapshot
        agent_id: main
        sessions:
          - {session_key: "agent:main:dashboard:aaa", model: openai/gpt-6.1-sol, runtime: codex, expected_runtime: openclaw, binding: stale}
          - {session_key: "agent:main:dashboard:bbb", model: openai/gpt-6-luna, runtime: openclaw, expected_runtime: openclaw, binding: current}
    expect: [openclaw-session-runtime-stale]
    expect_not: [openclaw-session-runtime-unapproved]

  - name: 허용되지 않은 런타임에 묶인 대화 (CLI 백엔드는 플러그인 판정을 거치지 않을 수 있다)
    agent: openclaw
    sensor: openclaw_gateway
    events:
      - kind: inventory.snapshot
        agent_id: main
        sessions:
          - {session_key: "agent:main:dashboard:ccc", model: anthropic/claude-x, runtime: claude-cli, expected_runtime: claude-cli, binding: current}
    expect: [openclaw-session-runtime-unapproved]
    expect_not: [openclaw-session-runtime-stale]

  - name: 기대 런타임을 모르거나(목록에 없는 모델) 고정되지 않은 모델의 대화, 현재 설정대로인 대화는 정상
    agent: openclaw
    sensor: openclaw_gateway
    events:
      - kind: inventory.snapshot
        agent_id: main
        sessions:
          - {session_key: "agent:main:main", model: openai/gpt-6-luna, runtime: openclaw, expected_runtime: openclaw, binding: current}
          - {session_key: "agent:main:cron:x", model: openai/old-model, runtime: codex, binding: unknown}
          # 고정되지 않은 모델(Sol)로 바꾼 대화가 만들어질 때의 openclaw를 유지: 따를 회사 설정이 없다(모델 쪽은 unpinned 룰이 본다).
          - {session_key: "agent:main:dashboard:y", model: openai/gpt-6.1-sol, runtime: openclaw, expected_runtime: codex, binding: unpinned}
    expect_not: [openclaw-session-runtime-stale, openclaw-session-runtime-unapproved]
