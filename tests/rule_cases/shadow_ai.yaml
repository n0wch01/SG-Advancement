# Unmanaged (shadow) agent installs (M5d): install.snapshot events from the sensor's discovery scan.
# One event per install. "managed" = configured + SG-Advance plugin enabled + this sensor watches its config.
# Decisions (2026-11-12, confirmed by the user: all recommended defaults): alert only; managed does not
# require an approved version yet (the integrity scan covers managed installs); the scan only looks
# for OpenClaw's own traces (binary, state dir, service file, its gateway port on 127.0.0.1).
# First sighting = changed: [present] (it went from absent to present; removal is changed: [present] too).
cases:
  # ── 비관리 설치 ──
  - name: 개인이 설치·설정한 OpenClaw (플러그인 없음, 센서 감시 없음)
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/home/carol/.openclaw", configured: true, running: true,
         bind_scope: loopback, guard_plugin: missing, watched: false, managed: false, changed: [present],
         unmanaged_reasons: ["guard plugin missing", "no SG-Advance sensor watches this config"]}
    expect: [openclaw-unmanaged-install]
    expect_not: [openclaw-gateway-network-exposed]

  # 알림 반복 문제(2026-11-13 수정): 게이트웨이 재시작은 running만 바뀐다. 관리 상태는 그대로라 다시 경보하지 않는다.
  - name: 비관리 설치의 게이트웨이 재시작은 다시 경보하지 않음
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/home/carol/.openclaw", configured: true, running: false,
         bind_scope: loopback, guard_plugin: missing, watched: false, managed: false, changed: [running]}
      - {kind: install.snapshot, product: openclaw, instance: "/home/carol/.openclaw", configured: true, running: true,
         bind_scope: loopback, guard_plugin: missing, watched: false, managed: false, changed: [running]}
    expect_not: [openclaw-unmanaged-install]

  # 미탐 방지: 재시작과 함께 관리 밖으로 나가면(플러그인 제거) 한 스캔에 함께 바뀌어도 경보한다.
  - name: 관리되던 설치가 재시작하면서 플러그인이 빠짐
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/Users/alice/.openclaw", configured: true, running: true,
         bind_scope: loopback, guard_plugin: missing, watched: true, managed: false,
         changed: [guard_plugin, managed, running, unmanaged_reasons]}
    expect: [openclaw-unmanaged-install]

  - name: 플러그인은 켜져 있지만 센서가 보지 않는 두 번째 프로필
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/home/carol/.openclaw-dev", configured: true,
         guard_plugin: enabled, watched: false, managed: false, changed: [present]}
    expect: [openclaw-unmanaged-install]

  - name: 비관리 게이트웨이가 네트워크에 열려 있음 (토큰이 새면 같은 망에서 전권 접속, T20)
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/home/carol/.openclaw", configured: true, running: true,
         bind: lan, bind_scope: network, guard_plugin: missing, watched: false, managed: false, changed: [present]}
    expect: [openclaw-unmanaged-install, openclaw-gateway-network-exposed]

  # ── 정상: 관리되는 설치 ──
  - name: 회사 기준대로 관리되는 개인 PC 설치 (루프백, 플러그인, 센서 감시)
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/Users/alice/.openclaw", configured: true, running: true,
         bind_scope: loopback, guard_plugin: enabled, watched: true, managed: true}
    expect_not: [openclaw-unmanaged-install, openclaw-gateway-network-exposed]

  # 팀 게이트웨이는 신원 프록시 뒤에서 일부러 lan으로 연다. 관리되는 설치라 노출 룰에서 빠진다.
  - name: 관리되는 팀 게이트웨이의 lan 바인드는 의도된 구성
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/home/node/.openclaw", configured: true, running: true,
         bind: lan, bind_scope: network, guard_plugin: enabled, watched: true, managed: true}
    expect_not: [openclaw-unmanaged-install, openclaw-gateway-network-exposed]

  # ── 정상(미탐 감수): 설치만 되어 있고 설정한 적 없음 ──
  # 같은 이미지를 쓰는 프록시 컨테이너처럼 코드만 있는 경우. 인벤토리로는 남지만 경보하지 않는다.
  - name: 코드만 설치되고 설정·실행된 적 없음
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/app", configured: false, running: false,
         watched: false, managed: false, unmanaged_reasons: ["not configured"]}
    expect_not: [openclaw-unmanaged-install, openclaw-gateway-network-exposed]

  - name: 사라진 설치는 경보하지 않는다
    agent: openclaw
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: openclaw, instance: "/home/carol/.openclaw", present: false,
         configured: true, managed: false}
    expect_not: [openclaw-unmanaged-install]

  # ── 다른 AI 에이전트 (2026-11-13, 섀도 AI 확장) ──
  # 회사가 통제하는 것은 SG-Advance hook이 붙은 Claude Code. 통제 수단이 없는 에이전트(Cursor, Codex, Gemini)는 회사 통제 밖이다.
  - name: Cursor가 설치·설정됨 (회사 통제 수단 없음)
    agent: unknown
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: cursor, instance: "cursor:/home/dev/.cursor", configured: true, managed: false,
         changed: [present], unmanaged_reasons: ["no SG-Advance control for cursor (route its MCP through the gateway)"]}
    expect: [ai-agent-outside-control]

  - name: hook이 붙은 Claude Code는 통제 안
    agent: claude_code
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: claude-code, instance: "claude-code:/home/dev/.claude", configured: true,
         guard_plugin: enabled, managed: true, changed: [present]}
    expect_not: [ai-agent-outside-control, mcp-server-bypasses-gateway]

  - name: hook이 없는 Claude Code도 통제 밖, 재시작류 변화(버전만 바뀜)는 다시 경보 안 함
    agent: claude_code
    sensor: agent_discovery
    events:
      - {kind: install.snapshot, product: claude-code, instance: "claude-code:/home/dev/.claude", configured: true,
         guard_plugin: missing, managed: false, changed: [present]}
      - {kind: install.snapshot, product: claude-code, instance: "claude-code:/home/dev/.claude", configured: true,
         guard_plugin: missing, managed: false, version: "2.1.300", changed: [version]}
    expect: [ai-agent-outside-control]

  # 게이트웨이를 거치지 않고 직접 붙은 원격 MCP 서버. 로컬(stdio) 서버와 게이트웨이를 모르는 장비(unknown)는 대상 아님.
  - name: 게이트웨이를 거치지 않는 원격 MCP 서버
    agent: claude_code
    sensor: agent_discovery
    events:
      - kind: install.snapshot
        product: claude-code
        instance: "claude-code:/home/dev/.claude"
        configured: true
        guard_plugin: enabled
        managed: true
        changed: [present]
        mcp_servers:
          - {name: crm, transport: http, url: "http://127.0.0.1:18790/mcp/crm", route: gateway}
          - {name: notion, transport: http, url: "https://mcp.notion.example/mcp", route: direct}
          - {name: files, transport: stdio, command: npx, route: local}
    expect: [mcp-server-bypasses-gateway]
    indicators: {mcp-server-bypasses-gateway: "https://mcp.notion.example/mcp"}

  - name: 게이트웨이·로컬·게이트웨이 미설정 장비는 정상
    agent: claude_code
    sensor: agent_discovery
    events:
      - kind: install.snapshot
        product: claude-code
        instance: "claude-code:/home/dev/.claude"
        configured: true
        managed: true
        changed: [present]
        mcp_servers:
          - {name: crm, transport: http, url: "http://127.0.0.1:18790/mcp/crm", route: gateway}
          - {name: files, transport: stdio, command: npx, route: local}
          - {name: wiki, transport: http, url: "https://wiki.corp/mcp", route: unknown}
    expect_not: [mcp-server-bypasses-gateway]
