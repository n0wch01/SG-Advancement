# 승인 감사 (C): 사용자가 실행 전 승인 창에 한 응답(approval.resolved).
# 결정(2026-11-12): 모든 응답은 이벤트로 남기고, finding은 high/critical 룰에 걸린 행동을 "승인"한 경우와
# 승인 피로(한 사용자가 10분에 5번 승인)만. 거절·시간 초과·취소는 기록만. 대응은 모두 알림(보안팀 사후 감사).
version: 1
rules:
  # 오탐 주의: 정당한 업무상 승인도 걸린다. 이 finding은 "막아야 했다"가 아니라 "보안팀이 볼 목록"이다.
  - id: user-approved-high-risk
    severity: medium
    category: policy_violation
    title: 사용자가 고위험 행동을 승인
    message: 높은 위험으로 판정돼 승인을 요청한 툴 호출을 사용자가 승인했습니다.
    recommended_action: 원래 호출(요청 이벤트)과 걸린 룰을 확인하세요. `sga-server audit approvals`로 같은 사용자의 다른 승인도 함께 보세요.
    response: alert
    dedup: none
    tags: [owasp-llm:LLM06]
    when: {payload.kind: approval.resolved, payload.approved: "true", payload.via: user}  # 보안팀 승인(via security)은 제외
    match:
      type: regex
      fields: [payload.max_severity]
      pattern: '^(high|critical)$'

  # MFA 피로 공격처럼, 반복되는 승인 창에 내용을 읽지 않고 누르는 패턴. 세션이 달라도 사용자 기준으로 센다.
  # 오탐 주의: 정말 바쁜 작업 중 연속 승인. 미탐: 10분에 4번씩 꾸준히 승인하는 경우.
  - id: approval-fatigue
    severity: medium
    category: policy_violation
    title: 짧은 시간에 반복된 승인
    message: 한 사용자가 10분 안에 5번 이상 실행 전 승인을 눌렀습니다. 경고를 읽지 않고 승인하고 있을 수 있습니다.
    recommended_action: 해당 사용자의 최근 승인 목록을 확인하고, 에이전트가 같은 위험 행동을 반복 시도하는지 보세요.
    response: alert
    tags: [owasp-llm:LLM06]
    when: {payload.kind: approval.resolved, payload.approved: "true", payload.via: user}  # 보안팀 승인(via security)은 제외
    match:
      type: rate
      window_seconds: 600
      threshold: 5
      group_by: [principal.user_id]

  # 승인-실행 대조 (2026-11-17, 검증 구조 2b). 보안팀 보류를 없애면서 "실행 직전 재검사·요청 동일성 확인"이 사라졌다.
  # 사용자 승인 창은 에이전트(Claude Code)가 실행하므로 실행 전에 다시 확인할 수 없다. 그래서 실행 직후에 대조한다:
  # hook이 실행 전·후의 툴 입력 지문(labels.sga_input_digest)을 붙이고, 센서가 승인한 호출의 지문과 실제로 실행된 지문을
  # 비교해 다르면 labels.sga_approval_mismatch를 붙인다(sensor/plugin_api.py). 이 룰이 걸리면 센서가 그 대화를 차단 목록에
  # 넣어(remote_blocked_sessions) 이후 툴 호출을 거부한다. 해제는 콘솔·`sga-server action unblock-session`.
  # 한계: 막는 것이 아니라 실행 직후에 잡는다(이미 실행된 한 번은 되돌리지 못함).
  # 오탐 주의: 다른 hook이나 사용자가 승인 창에서 입력을 고친 정당한 경우도 걸린다.
  - id: approval-execution-mismatch
    severity: critical
    category: policy_violation
    title: 승인한 것과 다른 요청이 실행됨
    message: 사용자가 승인한 툴 호출과 실제로 실행된 호출의 입력이 다릅니다. 이 대화의 이후 툴 호출을 막았습니다.
    recommended_action: 요청 이벤트(승인한 입력)와 결과 이벤트(실행된 입력)를 비교하고, 다른 hook이나 에이전트가 입력을 바꿨는지 확인하세요. 확인 후 대화 차단을 해제하세요.
    response: abort_session
    dedup: none
    tags: ["action-independent", owasp-llm:LLM06]
    when: {payload.kind: approval.resolved, labels.sga_approval_mismatch: "true"}
    match:
      type: regex
      fields: [labels.sga_approval_mismatch]
      pattern: '^true$'
