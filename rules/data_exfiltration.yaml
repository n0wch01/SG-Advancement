# 데이터 유출: 민감 파일 접근, 자격증명 노출, 미허가 외부 전송
version: 1
rules:
  - id: sensitive-file-access
    severity: high
    category: data_exfiltration
    title: 민감 파일 접근
    message: 툴 호출이 자격증명·키 파일(.env, ~/.ssh, ~/.aws/credentials 등)에 접근합니다.
    recommended_action: 작업에 필요한 접근인지 확인하고, 아니라면 파일 접근 allowlist를 적용하세요.
    tags: ["grade:0", owasp-llm:LLM02, scenario:S2]
    when: {payload.kind: tool.call}
    match:
      type: regex
      fields: [payload.arguments]
      pattern: '(^|[^\w.])\.env\b(?!\.example|\.sample|\.template)|\bid_(rsa|ed25519|ecdsa)\b|\.ssh/|\.aws/credentials|\.netrc\b|\.git-credentials\b|\.kube/config'

  # 한 명령 안에 "민감 파일"과 "보내는 동작"이 같이 있으면 인젝션 여부와 상관없이 차단한다.
  # 오탐 주의: 내려받기(curl -o .env)는 보내는 동작이 아니라 걸리지 않는다. 사내 비밀 저장소로 일부러 올리는
  #   스크립트가 있다면 걸린다 → M9 팀 정책의 허용 목록 후보.
  # 미탐 주의: 변수나 base64로 감싼 경로(F=.env; curl -d @$F), 두 단계로 나눈 명령(cp .env /tmp/x 후 curl)은 못 본다.
  #   두 단계는 injection-then-sensitive-action처럼 sequence 룰로 다뤄야 한다.
  - id: sensitive-file-exfil-command
    severity: critical
    category: data_exfiltration
    title: 민감 파일을 외부로 보내는 명령
    message: 자격증명·키 파일을 네트워크로 전송하는 명령이 실행되려 합니다.
    recommended_action: 호출을 차단하고, 이 명령을 만든 입력(문서, 이슈, 프롬프트)을 확인하세요. 이미 실행됐다면 해당 자격증명을 교체하세요.
    response: block
    tags: ["grade:3-1", owasp-llm:LLM02, incident:nx-s1ngularity-2025]
    when: {payload.kind: tool.call}
    match:
      type: regex
      ignore_case: true
      fields: [payload.arguments]
      pattern: '(?s)^(?=.*(?:(^|[^\w.])\.env\b(?!\.example|\.sample|\.template)|\bid_(rsa|ed25519|ecdsa)\b|\.ssh/|\.aws/credentials|\.netrc\b|\.git-credentials\b|\.kube/config)).*?(?:\bcurl\b[^|;&]*?(?:\s(?:-d|--data(?:-binary|-raw|-urlencode)?|-F|--form|-T|--upload-file)\b|\s-X\s*(?:POST|PUT)\b)|\bwget\b[^|;&]*?--post-(?:file|data)\b|\bscp\b|\brsync\b[^|;&]*?\S+:|\bnc\s|\binvoke-(?:webrequest|restmethod)\b)'

  # 탐지는 마스킹 "전"의 원본 이벤트에서 돈다. 그래서 실제 키 형식을 볼 수 있다.
  - id: secret-in-output
    severity: critical
    category: data_exfiltration
    title: 자격증명 노출 (툴 결과 / 모델 응답)
    message: 툴 결과나 모델 응답에 API 키·개인키 등 자격증명 형식이 포함됐습니다.
    recommended_action: 해당 자격증명을 즉시 회수(rotate)하고 노출 경로를 점검하세요.
    tags: [owasp-llm:LLM02, scenario:S2]
    when: {payload.kind: [tool.result, message.assistant]}
    match:
      type: regex
      fields: [payload.output_preview, payload.text]
      pattern: '-----BEGIN ((EC|PGP|DSA|RSA|OPENSSH) )?PRIVATE KEY( BLOCK)?-----|\b(A3T[A-Z0-9]|AKIA|AGPA|AIDA|AROA|AIPA|ANPA|ANVA|ASIA)[A-Z0-9]{16}\b|\bgh[pousr]_[A-Za-z0-9]{36,}|\bsk-(ant-|proj-)?[A-Za-z0-9_-]{20,}|\bAIza[0-9A-Za-z_-]{35}|xox[pborsa]-[0-9]{10,}-[0-9A-Za-z-]+|sk_live_[0-9a-zA-Z]{24}|(?i:\b(api[_-]?key|secret[_-]?key|access[_-]?token|password)\s*[:=]\s*\S{8,})'

  # 이미 센서 단에서 마스킹된 값([REDACTED:...])이 툴 인자로 나가는 것 자체가 유출 신호다.
  - id: secret-in-tool-arguments
    severity: high
    category: data_exfiltration
    title: 자격증명이 툴 인자로 전달됨
    message: 자격증명(또는 마스킹된 자격증명)이 툴 호출 인자에 실려 나갑니다.
    recommended_action: 호출을 차단하고 어떤 지시로 자격증명이 인자에 들어갔는지 확인하세요.
    response: block
    tags: ["grade:3-1", owasp-llm:LLM02]
    when: {payload.kind: tool.call}
    match:
      type: regex
      fields: [payload.arguments]
      pattern: '\[REDACTED:[\w-]+\]|-----BEGIN [A-Z ]*PRIVATE KEY|\b(AKIA|ASIA)[A-Z0-9]{16}\b|\bgh[pousr]_[A-Za-z0-9]{36,}|\bsk-(ant-|proj-)?[A-Za-z0-9_-]{20,}'

  - id: vigil-generic-secret
    severity: low
    category: data_exfiltration
    title: 일반 시크릿 키워드 (Vigil ContainsGenericSecretPhrase)
    message: '"private/secret/access key|token|password" 형식의 키워드가 감지됐습니다.'
    recommended_action: 실제 시크릿이 포함됐는지, 시크릿 추출을 유도하는 문서인지 확인하세요.
    when: {payload.kind: [tool.result, message.assistant]}
    match:
      type: regex
      fields: [payload.output_preview, payload.text]
      ignore_case: true
      pattern: '(private|secret|access)\s(key|token|password|pass)'

  - id: egress-unapproved-host
    severity: high
    category: data_exfiltration
    title: 미허가 외부 호스트로 전송
    message: 허용목록에 없는 외부 호스트로 네트워크 요청이 나갔습니다.
    recommended_action: 목적지를 확인하고, 유출이 의심되면 세션을 중단하세요.
    response: block
    tags: [campaign, owasp-llm:LLM02, scenario:S1, scenario:S2]
    when: {payload.kind: net.egress, payload.destination: external}
    match:
      type: allowlist
      field: payload.host
      allow:
        - api.anthropic.com
        - "*.openai.com"
        - chatgpt.com             # 구독 로그인 방식 모델 호출 (팀 게이트웨이 실측, 2026-11-12). www.gravatar.com은 일부러 뺌(이메일 해시 외부 전송)
        - generativelanguage.googleapis.com
        - github.com
        - "*.github.com"
        - pypi.org
        - files.pythonhosted.org
        - registry.npmjs.org

  # ── 2차 시나리오 (CLAUDE.md): 테스트 DB에서 조회한 보호 데이터를 미승인 외부 목적지로 전송 ──
  # 범위: 테스트 DB(MCP 서버 testdb)의 툴, 데이터를 밖으로 싣는 툴 호출(셸, 웹 요청, MCP 툴, 파일 쓰기). 일반 DLP가 아니다.
  # 설계: docs/lineage.md. 출처 룰이 보호 컬럼 값을 모으면 센서가 솔트 해시로만 보관한다(값은 PC 밖으로 나가지 않고,
  #   기록되는 이벤트에서도 가린다). 툴 호출 인자에 그 값(또는 그 값을 쓴 파일 경로)이 있으면 센서가 라벨을 붙인다.
  # 출처를 믿는 이유: 값은 DB 응답 바이트(게이트웨이·툴 결과 hook)에서 나오고, 목적지는 호출 자체(URL 호스트, MCP 서버,
  #   파일 경로)에서 읽는다. 에이전트가 붙인 "안전"·"공개" 같은 표시는 읽지 않는다. 라벨은 센서만 붙인다(입력의 같은 라벨은 지움).
  - id: protected-data-read
    severity: medium
    category: data_exfiltration
    title: 테스트 DB 보호 데이터 조회
    message: 테스트 DB에서 보호 컬럼(주민번호·전화·계좌·이메일)이 조회됐습니다. 이후 이 값이 어디로 가는지 추적합니다.
    recommended_action: 업무상 필요한 조회인지 확인하세요. 이 Finding은 전송 차단 Finding의 출처로 함께 보입니다.
    response: alert
    tags: [lineage:source, scenario:P2]
    # sga_lineage=tracked: only a sensor that keeps lineage (and masks the values) judges this rule.
    when: {payload.kind: tool.result, payload.provider.mcp_server: testdb, labels.sga_lineage: tracked}
    # 미탐 주의: 컬럼 이름이 다르거나(별칭 SELECT phone AS p) JSON이 아닌 결과(표·CSV)는 못 모은다.
    #   보호 컬럼은 이 목록이 정의한다: 테스트 DB 스키마가 바뀌면 같이 고친다.
    # 오탐 주의: 값이 4자 미만이면 추적하지 않는다(짧은 값은 우연히 겹친다).
    match:
      type: regex             # lineage:source 태그: 첫 매치가 아니라 모든 값을 모음(엔진)
      fields: [payload.output_preview]
      pattern: '\\?"(?P<field>rrn|phone|account_no|email)\\?"\s*:\s*\\?"(?P<value>[^"\\]{4,})\\?"'

  # 민감도(sga_data_class)와 목적지(sga_destinations)를 함께 본다. 양은 보지 않는다(한 건이라도 차단).
  # 승인된 목적지: 테스트 DB 자신, 사내 보고서 MCP, 로컬 파일(쓴 파일은 경로로 계속 추적), 목적지가 없는 셸 명령, 사내 호스트.
  # 오탐 주의: 사내 시스템이 목록에 없으면 막힌다 → 목록에 추가. 여기 목록은 아래 룰과 같게 유지한다(unknown만 다름,
#   어긋나면 tests/test_rule_lists.py가 실패).
  # 미탐 주의: 값을 바꿔 보내면(base64, 일부만, 요약) 연결되지 않는다. 셸 명령의 출력을 파일로 보낸 뒤(> out.csv) 그 파일을
  #   보내는 경우는 파일 내용을 센서가 보지 못해 연결되지 않는다(에이전트의 Write·Edit로 쓴 파일만 추적).
  - id: protected-data-to-unapproved-destination
    severity: critical
    category: data_exfiltration
    title: 보호 데이터를 미승인 목적지로 전송
    message: 테스트 DB에서 조회한 보호 데이터가 승인되지 않은 목적지로 나가려 합니다.
    recommended_action: 호출은 차단됐습니다. 출처 조회(근거 이벤트)와 목적지를 확인하고, 인젝션이 있었는지 같은 대화를 검토하세요.
    response: block
    tags: ["grade:3-1", lineage:sink, "split:,", owasp-llm:LLM02, scenario:P2]
    when: {payload.kind: tool.call, labels.sga_data_class: protected}
    match:
      type: allowlist
      field: labels.sga_destinations
      allow: ["mcp:testdb", "mcp:reports", "file:*", local, unknown, "*.corp.internal"]

  # 결정(2026-11-14): 목적지가 안 보이면(local: 주소 없는 셸 명령, unknown: 목적지를 모르는 툴) 바로 막지 않고 사용자가 승인한다.
  #   예: python upload.py <값>(스크립트 안에서 보냄)과 grep <값> result.txt(PC 안에서만)를 센서가 구분하지 못한다.
  #   사용자가 승인하면 user-approved-high-risk로 보안팀 사후 검토 큐에 오른다.
  # 오탐 주의: 보호 값을 PC 안에서만 다루는 셸 명령도 묻는다. 미탐 주의: 값이 바뀌면(위 룰과 같음) 연결되지 않는다.
  - id: protected-data-destination-unclear
    severity: high
    category: data_exfiltration
    title: 보호 데이터가 실린 호출의 목적지 불명
    message: 테스트 DB에서 조회한 보호 데이터가 실린 호출인데, 어디로 가는지 호출에서 보이지 않아 사용자 승인을 받습니다.
    recommended_action: 사용자가 승인했다면 보안팀 검토 큐에서 명령과 출처 조회를 확인하세요. 외부 전송이었다면 그 사람·대화를 차단하세요.
    response: require_approval
    tags: ["grade:3-1", lineage:sink, scenario:P2]
    when: {payload.kind: tool.call, labels.sga_data_class: protected}
    match:
      type: regex
      fields: [labels.sga_destinations]
      pattern: '(^|,)(local|unknown)(,|$)'

  # 실패 처리(fail closed): 출처 기록 파일을 읽을 수 없으면 어떤 호출이 보호 데이터를 싣는지 모른다.
  # 그때는 미승인 목적지로 가는 호출을 모두 막는다(로컬·사내 목적지는 그대로).
  - id: transfer-with-lineage-unavailable
    severity: high
    category: data_exfiltration
    title: 출처 기록 없이 미승인 목적지로 전송
    message: 데이터 출처 기록을 읽을 수 없어, 보호 데이터가 실렸는지 확인하지 못한 채 미승인 목적지로 나가려 해 차단했습니다.
    recommended_action: 센서의 lineage.json이 손상·삭제됐는지 확인하세요. 사용자가 지웠다면 우회 시도로 보고 조사하세요.
    response: block
    tags: ["grade:3-1", lineage:sink, "split:,", scenario:P2]
    when: {payload.kind: tool.call, labels.sga_lineage: unavailable}
    match:
      type: allowlist
      field: labels.sga_destinations
      allow: ["mcp:testdb", "mcp:reports", "file:*", local, "*.corp.internal"]
