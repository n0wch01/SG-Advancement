# 툴 오남용: 파괴적 명령, 안전장치를 끈 실행
version: 1
rules:
  - id: destructive-shell-command
    severity: high
    category: tool_misuse
    title: 파괴적 셸 명령
    message: 되돌리기 어려운 셸 명령(rm -rf, mkfs, dd, force push 등)이 실행되려 합니다.
    recommended_action: 사용자가 승인한 경우 보안팀 검토 큐에서 명령과 대상을 확인하세요.
    # 결정(2026-11-14): 사용자 승인 먼저, 매우 위험한 것(공격 진행 신호·외부 유출)만 바로 차단, 보안팀은 사후 검토.
    #   되돌릴 수 없는 삭제는 "매우 위험"에 넣지 않아 차단 → 사용자 승인으로 바꿨다.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06]
    when: {payload.kind: tool.call}
    match:
      type: regex
      fields: [payload.arguments]
      pattern: '\brm\s+-[a-zA-Z]*(rf|fr)[a-zA-Z]*\b|\brm\s+-[a-zA-Z]*r[a-zA-Z]*\s+-[a-zA-Z]*f|\bmkfs(\.\w+)?\b|\bdd\s+if=|:\(\)\s*\{\s*:\|:&\s*\};:|\bchmod\s+-R\s+777\s+/|\bgit\s+push\s+.*(--force\b|-f\b)'

  # T17 (docs/incidents.md: Replit, Amazon Q). 셸 룰이 못 보는 DB·클라우드 경로.
  # 오탐 주의: 개발 DB를 일부러 초기화하는 작업도 걸린다. 그래서 block이 아니라 require_approval.
  # 파일에 SQL을 쓰는 것(Write의 content)은 실행이 아니므로 보지 않는다: fields를 실행 인자로 한정했다.
  # 어디서 잡나(2026-11-13 오탐 수정: 전에는 echo·grep·커밋 메시지 속 SQL 글자도 걸렸다):
  #   1) 문장이 텍스트 맨 앞이나 ; 뒤에서 시작(DB 툴의 query·sql·statement, 주석 줄은 건너뜀)
  #   2) 셸 명령에서 DB 클라이언트(psql, mysql, sqlite3 …) 뒤에 오는 SQL(-c, -e, 히어독, docker exec 안)
  #   3) SQL을 파이프로 DB 클라이언트에 넘김(echo '…' | psql)
  # 미탐 주의: 목록에 없는 클라이언트나 스크립트(python -c "cur.execute('DELETE …')", ./run_sql.sh)는 놓친다.
  # 오탐 주의: 여러 문장을 파일로 쓰는 히어독(cat > x.sql <<EOF … ; DROP TABLE …)은 1)에 걸린다.
  - id: destructive-sql
    severity: high
    category: tool_misuse
    title: 파괴적 SQL 실행
    message: 테이블·DB 삭제나 조건 없는 DELETE/TRUNCATE가 실행되려 합니다.
    recommended_action: 운영 DB인지 확인하고, 사람이 승인한 경우에만 실행하세요. 백업 여부를 먼저 확인하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06, incident:replit-2025]
    when: {payload.kind: tool.call}
    # Code Mode outer call: its JavaScript repeats the command, and the inner call that really
    # runs it is judged on its own. One approval per command (tests/rule_cases/tool_misuse.yaml).
    unless: {labels.openclaw.tool_kind: code_mode_exec}
    match:
      type: regex
      ignore_case: true
      fields: [payload.arguments.query, payload.arguments.sql, payload.arguments.statement, payload.arguments.command]
      pattern: >-   # (?x): 줄바꿈·공백은 무시, 세 갈래는 위 주석의 1) 2) 3)
        (?x)(?:^|;)(?:\s|--[^\n]*\n)*(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))
        |\b(?:psql|mysql|mariadb|sqlite3|sqlcmd|clickhouse-client|duckdb|snowsql|mongosh|cqlsh|cockroach\s+sql|bq\s+query)\b[\s\S]*?\b(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))
        |\b(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))[^|\n]*\|\s*(?:\S+\s+)*?(?:psql|mysql|mariadb|sqlite3|sqlcmd|clickhouse-client|duckdb|snowsql|mongosh|cqlsh|cockroach\s+sql|bq\s+query)\b

  # 오탐 주의: 단일 자원 삭제(kubectl delete pod 등)는 일부러 뺐다. gcloud/az의 delete는 범위가 넓어 아직 넣지 않았다.
  - id: destructive-cloud-command
    severity: high
    category: tool_misuse
    title: 클라우드 자원 일괄 삭제
    message: 클라우드 자원을 대량 또는 영구 삭제하는 명령이 실행되려 합니다.
    recommended_action: 대상 계정과 자원을 확인하고, 사람이 승인한 경우에만 실행하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06, incident:amazon-q-2025]
    when: {payload.kind: tool.call}
    # Code Mode outer call: its JavaScript repeats the command, and the inner call that really
    # runs it is judged on its own. One approval per command (tests/rule_cases/tool_misuse.yaml).
    unless: {labels.openclaw.tool_kind: code_mode_exec}
    match:
      type: regex
      fields: [payload.arguments]
      pattern: '\baws\s+s3\s+rb\b|\baws\s+s3\s+rm\b.*--recursive|\baws\s+[\w-]+\s+(delete|terminate)-[\w-]+|\bterraform\s+destroy\b|\bkubectl\s+delete\s+(ns|namespaces?|all)\b|\bkubectl\s+delete\b.*--all\b'

  # T15 (docs/incidents.md: Nx s1ngularity). 센서가 session.start에 실행 방식을 담아야 동작한다 (M6~).
  # 오탐 주의: 샌드박스·컨테이너에서 일부러 권한 확인을 끄는 개발자도 있다. 그래서 alert.
  - id: agent-safety-bypass
    severity: medium
    category: policy_violation
    title: 권한 확인을 끈 에이전트 실행
    message: 에이전트가 툴 실행 전 사용자 확인을 끈 모드로 시작했습니다.
    recommended_action: 격리된 환경인지 확인하세요. 일반 업무 PC라면 기본 모드를 쓰도록 안내하세요.
    response: alert
    tags: [owasp-llm:LLM06, incident:nx-s1ngularity-2025]
    when: {payload.kind: session.start}
    match:
      type: regex
      ignore_case: true
      fields: [payload.permission_mode]
      pattern: 'bypass|yolo|dangerous|full-auto|trust-all'

  # 사람이 없는데 확인까지 꺼졌다면 다른 프로그램이 에이전트를 부리는 것일 수 있다.
  # 오탐 주의: CI에서 claude -p 등을 이렇게 돌리는 정상 사용이 있다. 그룹별 예외는 M9 정책에서.
  - id: agent-unattended-safety-bypass
    severity: critical
    category: policy_violation
    title: 사람 없이 권한 확인을 끈 에이전트 실행
    message: 터미널에 사람이 없는 상태로, 툴 실행 확인을 끈 에이전트가 시작됐습니다. 악성코드가 에이전트를 대신 실행하는 패턴입니다.
    recommended_action: 부모 프로세스(parent_process)를 확인하세요. CI가 아니라면 세션을 중단하고 장비를 점검하세요.
    response: abort_session
    tags: [owasp-llm:LLM06, incident:nx-s1ngularity-2025]
    when: {payload.kind: session.start, payload.interactive: "false"}
    match:
      type: regex
      ignore_case: true
      fields: [payload.permission_mode]
      pattern: 'bypass|yolo|dangerous|full-auto|trust-all'

  # M5c. 게이트웨이 플러그인(before_tool_call)이 동작 중인데 판정 기록 없이 실행된 툴 호출.
  # 센서의 WebSocket 어댑터가 플러그인이 최근에 연결된 동안에만 라벨을 붙인다(docs/sensor.md).
  # 오탐 주의: 플러그인이 다루지 않는 실행 경로(예: Codex 네이티브 툴 중 hook 릴레이가 없는 것)도 걸린다.
  #   그런 경로를 확인하면 이 룰을 끄지 말고 원인을 고친다 — 그것 자체가 통제 공백이다.
  # 집행: WS 어댑터는 v4에서 막을 수 없으므로 alert. 보안팀이 플러그인 상태를 확인한다.
  - id: openclaw-plugin-bypass
    severity: high
    category: policy_violation
    title: 게이트웨이 플러그인을 거치지 않은 툴 실행
    message: 실행 전 판정 플러그인이 동작 중인데, 플러그인 판정 기록이 없는 툴 호출이 실행됐습니다.
    recommended_action: OpenClaw 플러그인이 꺼졌거나 우회됐는지 확인하세요(`openclaw plugins inspect sg-advance`). 해당 세션의 실행 내역을 검토하세요.
    response: alert
    tags: ["action-independent", owasp-llm:LLM06]
    when: {payload.kind: tool.call, labels.sga_plugin: missing}
    match:
      type: regex
      fields: [labels.sga_plugin]
      pattern: '^missing$'

  # M5c. 플러그인이 정기 신호(60초마다)를 보내다 끊겼다. 센서 데몬이 150초 넘게 신호를 못 받으면 낸다.
  # 플러그인이 꺼졌거나 게이트웨이가 플러그인 없이 재시작됐을 수 있다 → 이후 툴 호출은 실행 전 판정 없이 돈다.
  # 오탐 주의: 게이트웨이를 정상적으로 내린 경우에도 걸린다(그때는 툴 호출도 없으므로 바로 확인 가능).
  - id: openclaw-plugin-heartbeat-lost
    severity: high
    category: policy_violation
    title: 게이트웨이 플러그인 신호 끊김
    message: 실행 전 판정 플러그인의 정기 신호가 끊겼습니다. 이후 툴 호출이 판정 없이 실행될 수 있습니다.
    recommended_action: 게이트웨이와 플러그인 상태를 확인하세요(`openclaw plugins list`, `openclaw gateway status`). 의도하지 않은 비활성화라면 해당 장비를 점검하세요.
    response: alert
    tags: [owasp-llm:LLM06]
    when: {payload.kind: sensor.health, payload.component: openclaw_plugin, payload.status: lost}
    match:
      type: regex
      fields: [payload.status]
      pattern: '^lost$'
