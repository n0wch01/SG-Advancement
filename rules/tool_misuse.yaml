# 툴 오남용: 파괴적 명령, 안전장치를 끈 실행
version: 1
rules:
  - id: destructive-shell-command
    version: "3"
    severity: high
    category: tool_misuse
    title: 파괴적 셸 명령
    message: 되돌리기 어려운 셸 명령(rm -rf, Remove-Item -Recurse, rd /s, find -delete, git reset --hard, mkfs, dd, force push 등)이 실행되려 합니다.
    recommended_action: 사용자가 승인한 경우 보안팀 검토 큐에서 명령과 대상을 확인하세요.
    # 결정(2026-11-14): 사용자 승인 먼저, 매우 위험한 것(공격 진행 신호·외부 유출)만 바로 차단, 보안팀은 사후 검토.
    #   되돌릴 수 없는 삭제는 "매우 위험"에 넣지 않아 차단 → 사용자 승인으로 바꿨다.
    response: require_approval
    # 구조 판정(2026-11-17, docs/actions.md): 센서가 셸 명령을 제한된 문법으로 해석해 labels.sga_act_destroy에 파괴적 행동의
    #   종류를 적는다(rm-recursive-force, find-delete, git-reset-hard …). 해석이 완전하면(sga_act_parse=ok) 이 룰은 그 라벨만 보고
    #   원문 글자는 보지 않는다(normalized-by 태그). 그래서 r''m -rf, 'rm' '-rf', 줄을 이어 쓴 rm -r \ -f도 같은 삭제이고,
    #   echo·grep·커밋 메시지·파일에 쓰는 글 속의 rm -rf는 실행이 아니다. 해석하지 못했거나 모르는 명령이 섞이면(partial,
    #   unsupported) 아래 원문 정규식이 그대로 판정한다(보조). 라벨이 없는 예전 센서도 원문으로 판정한다.
    # 오탐 변화: 명령을 인용·검색·기록하는 호출(위 예)은 해석이 완전할 때 더 이상 묻지 않는다.
    # 미탐 변화: 따옴표·이스케이프로 나눈 명령 이름, 줄 이어 쓰기가 이제 잡힌다. git push origin +main(강제 푸시),
    #   dd of=…가 앞에 오는 경우, git checkout HEAD -- .도 잡는다(전에는 놓침).
    # 그대로인 미탐: 변수에 담은 명령($R -rf), $(…)로 만든 인자 안의 명령, eval, 스크립트·인라인 코드(python -c) 안의 삭제.
    tags: ["grade:3-1", owasp-llm:LLM06, "normalized-by:sga_act"]
    when: {payload.kind: tool.call}
    # 오탐 수정(2026-11-14, 사용자 결정): Code Mode 바깥 호출은 JavaScript에 명령을 담고 있을 뿐, 실제로 실행하는 안쪽 호출이
    #   따로 판정된다. 사용자 승인이 된 뒤로 두 번 묻게 돼 다른 승인 룰처럼 건너뛴다(명령당 한 번).
    unless: {labels.openclaw.tool_kind: code_mode_exec}
    match:
      type: regex
      fields: [payload.arguments, labels.sga_act_destroy]
      # Windows(2026-11-15, 사용자 결정: rm -rf와 같은 사용자 승인). PowerShell은 대소문자를 가리지 않아 (?i:) 안에 둔다.
      #   Remove-Item ... -Recurse(-r…), 별칭 rm/ri/del/erase/rmdir/rd ... -Recurse(-rec…), cmd rd·rmdir /s, del·erase /s,
      #   Format-Volume, Clear-Disk, format D:. 문장 구분(; | & 줄바꿈)을 넘지 않는다.
      # 오탐 주의: 빌드 폴더(node_modules 등)를 지우는 일상 작업도 묻는다(리눅스 rm -rf와 같은 수준).
      # 미탐 주의: (rm -r C:\x는 2026-11-17부터 rm 갈래가 잡음) 다른 별칭의 짧은 인자(ri -r), 변수·문자열 조합으로 만든 명령, -EncodedCommand,
      #   .NET 직접 호출([IO.Directory]::Delete($p, $true)), 스크립트 파일 안의 삭제는 못 잡는다.
      # rm: 재귀(-r, -R, --recursive)가 있으면(순서·표기 무관). 2026-11-17 사용자 결정: 강제(-f) 없이도 묻는다
      #   (에이전트는 터미널 없이 실행해 rm -r도 묻지 않고 지운다; 2026-11-15의 "-r과 -f가 함께" 기준을 바꿈).
      #   git rm은 저장소 추적 해제·삭제라 제외한다(git rm -r --cached의 오탐).
      # rm 없이 지우기·작업 내용 날리기(2026-11-15, 사용자 결정: 사용자 승인): find -delete / -exec rm, shred, git clean(강제),
      #   git reset --hard, git checkout -- ., git restore . (미리 보기 -n, 파일 하나, --staged는 제외).
      # 오탐 주의: 개발자가 자주 쓰는 git clean -fdx, git reset --hard에도 승인 창이 뜬다.
      # 미탐 주의: git stash drop/clear, 별칭(alias)으로 만든 명령, 스크립트 안의 같은 명령은 못 본다.
      pattern: '(?<!git\s)\brm\b(?=[^;&|\n]*\s(?:-[a-zA-Z]*[rR][a-zA-Z]*|--recursive)\b)|\bfind\b[^;&|\n]*\s-delete\b|\bfind\b[^;&|\n]*\s-exec\s+rm\b|\bshred\s+\S|\bgit\s+clean\b(?![^;&|\n]*\s(?:-[a-zA-Z]*n[a-zA-Z]*|--dry-run)\b)(?=[^;&|\n]*\s(?:-[a-zA-Z]*f[a-zA-Z]*|--force)\b)|\bgit\s+reset\b[^;&|\n]*\s--hard\b|\bgit\s+checkout\s+(?:--\s+)?\.(?=$|\s|[;&|])|\bgit\s+restore\b(?![^;&|\n]*--staged)[^;&|\n]*\s\.(?=$|\s|[;&|])|\bmkfs(\.\w+)?\b|\bdd\s+if=|:\(\)\s*\{\s*:\|:&\s*\};:|\bchmod\s+-R\s+777\s+/|\bgit\s+push\s+.*(--force\b|-f\b)|(?i:\bremove-item\b[^;|&\n]*?\s-r\w*\b|(?<!git\s)\b(?:ri|rm|del|erase|rmdir|rd)\s(?:[^;|&\n]*?\s)?-rec\w*\b|\b(?:rd|rmdir)\s+(?:\S+\s+)*?/s\b|\b(?:del|erase)\s+(?:\S+\s+)*?/s\b|\bformat-volume\b|\bclear-disk\b|\bformat\s+[a-z]:(?![\w\\/]))|(?:^|,)(?:rm-recursive-force|rm-recursive|find-delete|find-exec-rm|shred-file|git-clean-force|git-reset-hard|git-checkout-all|git-restore-all|git-push-force|mkfs-format|dd-raw-write|chmod-777-root)(?=,|$)'

  # T17 (docs/incidents.md: Replit, Amazon Q). 셸 룰이 못 보는 DB·클라우드 경로.
  # 오탐 주의: 개발 DB를 일부러 초기화하는 작업도 걸린다. 그래서 block이 아니라 require_approval.
  # 파일에 SQL을 쓰는 것(Write의 content)은 실행이 아니므로 보지 않는다: fields를 실행 인자로 한정했다.
  # 어디서 잡나(2026-11-13 오탐 수정: 전에는 echo·grep·커밋 메시지 속 SQL 글자도 걸렸다):
  #   1) 문장이 텍스트 맨 앞이나 ; 뒤에서 시작(DB 툴의 query·sql·statement, 주석 줄은 건너뜀)
  #   2) 셸 명령에서 DB 클라이언트(psql, mysql, sqlite3 …) 뒤에 오는 SQL(-c, -e, 히어독, docker exec 안)
  #   3) SQL을 파이프로 DB 클라이언트에 넘김(echo '…' | psql)
  # 미탐 주의: 목록에 없는 클라이언트나 스크립트(python -c "cur.execute('DELETE …')", ./run_sql.sh)는 놓친다.
  # 오탐 주의: 여러 문장을 파일로 쓰는 히어독(cat > x.sql <<EOF … ; DROP TABLE …)은 1)에 걸린다.
  - id: destructive-sql
    severity: high
    category: tool_misuse
    title: 파괴적 SQL 실행
    message: 테이블·DB 삭제나 조건 없는 DELETE/TRUNCATE가 실행되려 합니다.
    recommended_action: 운영 DB인지 확인하고, 사람이 승인한 경우에만 실행하세요. 백업 여부를 먼저 확인하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06, incident:replit-2025]
    when: {payload.kind: tool.call}
    # Code Mode outer call: its JavaScript repeats the command, and the inner call that really
    # runs it is judged on its own. One approval per command (tests/rule_cases/tool_misuse.yaml).
    unless: {labels.openclaw.tool_kind: code_mode_exec}
    match:
      type: regex
      ignore_case: true
      fields: [payload.arguments.query, payload.arguments.sql, payload.arguments.statement, payload.arguments.command]
      pattern: >-   # (?x): 줄바꿈·공백은 무시, 세 갈래는 위 주석의 1) 2) 3)
        (?x)(?:^|;)(?:\s|--[^\n]*\n)*(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))
        |\b(?:psql|mysql|mariadb|sqlite3|sqlcmd|clickhouse-client|duckdb|snowsql|mongosh|cqlsh|cockroach\s+sql|bq\s+query)\b[\s\S]*?\b(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))
        |\b(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))[^|\n]*\|\s*(?:\S+\s+)*?(?:psql|mysql|mariadb|sqlite3|sqlcmd|clickhouse-client|duckdb|snowsql|mongosh|cqlsh|cockroach\s+sql|bq\s+query)\b

  # 오탐 주의: 단일 자원 삭제(kubectl delete pod 등)는 일부러 뺐다. gcloud/az의 delete는 범위가 넓어 아직 넣지 않았다.
  - id: destructive-cloud-command
    severity: high
    category: tool_misuse
    title: 클라우드 자원 일괄 삭제
    message: 클라우드 자원을 대량 또는 영구 삭제하는 명령이 실행되려 합니다.
    recommended_action: 대상 계정과 자원을 확인하고, 사람이 승인한 경우에만 실행하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06, incident:amazon-q-2025]
    when: {payload.kind: tool.call}
    # Code Mode outer call: its JavaScript repeats the command, and the inner call that really
    # runs it is judged on its own. One approval per command (tests/rule_cases/tool_misuse.yaml).
    unless: {labels.openclaw.tool_kind: code_mode_exec}
    match:
      type: regex
      fields: [payload.arguments]
      pattern: '\baws\s+s3\s+rb\b|\baws\s+s3\s+rm\b.*--recursive|\baws\s+[\w-]+\s+(delete|terminate)-[\w-]+|\bterraform\s+destroy\b|\bkubectl\s+delete\s+(ns|namespaces?|all)\b|\bkubectl\s+delete\b.*--all\b'

  # ── 후속 시나리오 ①: 외부 입력 뒤의 파괴적 행동 (docs/external-input.md, 2026-11-14) ──
  # 출처: 센서가 툴 결과마다 그 호출이 말을 건 곳을 labels.sga_input_source로 붙인다(웹 호스트, mcp:<서버>, search, local, file:<경로>).
  #   호출 인자에서 읽은 것이고 에이전트가 붙인 같은 이름 라벨은 지운다. 외부인지는 아래 룰이 정한다.
  # 파괴적 행동 패턴은 위 세 룰(셸·SQL·클라우드)을 합친 것이다(&destructive). 위 룰을 고치면 여기도 같이 고친다
  #   (tests/test_rule_cases.py가 위 룰의 양성 케이스가 여기에도 걸리는지 확인).
  # 결정(2026-11-14): 인젝션 문구 뒤 = 공격 진행 신호 → 바로 차단. 인젝션 문구 없는 외부 입력 뒤 = 사용자 승인(따로 기록, 보안팀 검토).
  # 미탐 주의: 문구를 바꾼 인젝션은 첫 룰이 놓치고 두 번째 룰(승인)로만 잡힌다. 다른 대화·하위 에이전트로 넘어간 경우는
  #   묶지 않는다(위임 통제는 따로). 센서 데몬이 없으면(hook 단독) 시퀀스를 기억하지 못한다.
  - id: injection-then-destructive-action
    version: "5"
    severity: critical
    category: prompt_injection
    title: 인젝션 이후 파괴적 행동
    message: 인젝션 의심 텍스트를 읽은 직후 같은 대화에서 되돌릴 수 없는 삭제·파괴 명령이 실행되려 해 차단했습니다.
    recommended_action: 인젝션이 들어온 문서(근거 이벤트의 첫 결과)의 출처를 확인하고, 같은 대화를 검토하세요.
    response: block
    # 구조 판정(2026-11-17): 파괴적 행동 단계는 destructive-shell-command와 같이 센서가 해석한 행동 라벨을 본다(normalized-by).
    tags: ["grade:3-1", owasp-llm:LLM01, owasp-llm:LLM06, scenario:F1, "normalized-by:sga_act"]
    match:
      type: sequence
      within_seconds: 600
      steps:
        - name: injected-content
          when: {payload.kind: tool.result}
          # 시그니처 근거만(2026-11-16 결정 (나)): 분류기만 근거인 경우는 classifier-injection-* 룰이 사용자 승인을 받는다.
          fields: [payload.output_preview]
          ignore_case: true
          # injection-then-sensitive-action(prompt_injection.yaml)의 1단계와 같게 유지
          pattern: 'ignore (all )?(previous|prior|above) instructions|<important>|<\|im_start\|>system|<<SYS>>|\.env.*읽|읽.*\.env|단계별.*지시|send .{0,40}(\.env|credentials|secret)'
        - name: destructive-action
          when: {payload.kind: tool.call}
          fields: &destructive_fields [payload.arguments.command, payload.arguments.cmd, payload.arguments.query, payload.arguments.sql, payload.arguments.statement, labels.sga_act_destroy]
          ignore_case: true
          pattern: &destructive >-
            (?x)(?<!git\s)\brm\b(?=[^;&|\n]*\s(?:-[a-z]*r[a-z]*|--recursive)\b)|\bfind\b[^;&|\n]*\s-delete\b|\bfind\b[^;&|\n]*\s-exec\s+rm\b|\bshred\s+\S|\bgit\s+clean\b(?![^;&|\n]*\s(?:-[a-z]*n[a-z]*|--dry-run)\b)(?=[^;&|\n]*\s(?:-[a-z]*f[a-z]*|--force)\b)|\bgit\s+reset\b[^;&|\n]*\s--hard\b|\bgit\s+checkout\s+(?:--\s+)?\.(?=$|\s|[;&|])|\bgit\s+restore\b(?![^;&|\n]*--staged)[^;&|\n]*\s\.(?=$|\s|[;&|])|\bmkfs(\.\w+)?\b|\bdd\s+if=|:\(\)\s*\{\s*:\|:&\s*\};:|\bchmod\s+-R\s+777\s+/|\bgit\s+push\s+.*(--force\b|-f\b)
            |\bremove-item\b[^;|&\n]*?\s-r\w*\b|(?<!git\s)\b(?:ri|rm|del|erase|rmdir|rd)\s(?:[^;|&\n]*?\s)?-rec\w*\b|\b(?:rd|rmdir)\s+(?:\S+\s+)*?/s\b|\b(?:del|erase)\s+(?:\S+\s+)*?/s\b|\bformat-volume\b|\bclear-disk\b|\bformat\s+[a-z]:(?![\w\\/])
            |\baws\s+s3\s+rb\b|\baws\s+s3\s+rm\b.*--recursive|\baws\s+[\w-]+\s+(delete|terminate)-[\w-]+|\bterraform\s+destroy\b|\bkubectl\s+delete\s+(ns|namespaces?|all)\b|\bkubectl\s+delete\b.*--all\b
            |(?:^|;)(?:\s|--[^\n]*\n)*(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))
            |\b(?:psql|mysql|mariadb|sqlite3|sqlcmd|clickhouse-client|duckdb|snowsql|mongosh|cqlsh|cockroach\s+sql|bq\s+query)\b[\s\S]*?\b(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))
            |\b(?:drop\s+(?:table|database|schema)\b|truncate\s+(?:table\s+)?[\w."]+|delete\s+from\s+[\w."]+\s*(?:;|$|[''"]))[^|\n]*\|\s*(?:\S+\s+)*?(?:psql|mysql|mariadb|sqlite3|sqlcmd|clickhouse-client|duckdb|snowsql|mongosh|cqlsh|cockroach\s+sql|bq\s+query)\b
            |(?:^|,)(?:rm-recursive-force|rm-recursive|find-delete|find-exec-rm|shred-file|git-clean-force|git-reset-hard|git-checkout-all|git-restore-all|git-push-force|mkfs-format|dd-raw-write|chmod-777-root)(?=,|$)

  # 대응 B, 분류기만 근거 (2026-11-16 사용자 결정 (나)): injection-then-destructive-action(시그니처, 차단)과 짝.
  #   분류기만 인젝션으로 본 결과 뒤의 파괴적 명령은 사용자 승인(오탐이 작업 차단으로 커지지 않게: 한국어 문서 0.94 사례).
  # 오탐 주의: 분류기 오판 뒤 10분 안의 정상 정리 작업. 원래도 destructive-shell-command가 승인을 받으므로 사용자 화면은 같고,
  #   이 룰은 "분류기가 본 인젝션 뒤"라는 근거를 따로 기록한다(critical, 사후 검토).
  - id: classifier-injection-then-destructive-action
    version: "3"
    severity: critical
    category: prompt_injection
    title: 분류기가 본 인젝션 이후 파괴적 행동
    message: 분류기가 인젝션으로 판정한 외부 입력을 읽은 뒤 같은 대화에서 되돌릴 수 없는 삭제·파괴 명령이 실행되려 해 사용자 승인을 받습니다.
    recommended_action: 승인됐다면 근거 이벤트의 첫 결과(분류기 판정과 원문)와 명령의 대상을 확인하세요. 분류기 오판이면 평가 데이터에 넣으세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM01, owasp-llm:LLM06, scenario:F1, "normalized-by:sga_act"]
    match:
      type: sequence
      within_seconds: 600
      steps:
        - name: classifier-confirmed
          when: {payload.kind: tool.result}
          fields: [labels.sga_judge_injection]
          pattern: '^malicious$'
        - name: destructive-action
          when: {payload.kind: tool.call}
          fields: *destructive_fields
          ignore_case: true
          pattern: *destructive

  - id: destructive-after-external-input
    version: "3"
    severity: critical
    category: tool_misuse
    title: 외부 콘텐츠를 읽은 직후의 파괴적 행동
    message: 외부(웹·외부 MCP·검색 등)에서 읽은 내용 직후 같은 대화에서 되돌릴 수 없는 명령이 실행되려 해 사용자 승인을 받습니다.
    recommended_action: 사용자가 승인했다면 보안팀 검토 큐에서 외부 입력(근거 이벤트의 첫 결과)과 명령이 이어지는지 확인하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM01, owasp-llm:LLM06, scenario:F1, "normalized-by:sga_act"]
    match:
      type: sequence
      within_seconds: 600
      steps:
        - name: external-input
          when: {payload.kind: tool.result}
          fields: [labels.sga_input_source]
          # 사내·로컬이 아닌 출처가 하나라도 있으면 외부. 사내 MCP 서버·사내 호스트 목록은 여기서 관리한다.
          pattern: '(?:^|,)(?!(?:local|mcp:(?:testdb|reports|crm)|file:[^,]*|[^,]*\.corp\.internal)(?:,|$))[^,]+'
        - name: destructive-action
          when: {payload.kind: tool.call}
          fields: *destructive_fields
          ignore_case: true
          pattern: *destructive

  # 2026-11-17 사용자 결정(5-C): 외부 입력 직후, 센서가 실행 내용을 읽을 수 없는 명령은 사용자 승인(docs/actions.md).
  #   행동 해석(sga_act_*)이 "해석 못 함"으로 남긴 것 중 실행 내용을 숨길 수 있는 형태만 본다: 변수에 담은 명령, eval,
  #   명령 치환($(…)·백틱), 프로세스 치환, 확장되는 히어독, 동적 bash -c, 스크립트 실행, 인라인 코드(python -c 등),
  #   셸이 표준입력을 실행, git 실행 설정(-c, --config-env).
  #   일부러 뺀 것: 모델에 없는 명령(unmodelled: npm·docker 등, 내용은 원문 룰이 본다), PowerShell 전체(항상 해석 불가라
  #   넣으면 Windows의 모든 명령을 묻게 됨), Code Mode 바깥 호출(language:javascript, 안쪽 호출을 따로 판정).
  # 오탐 주의: 외부 문서를 읽은 뒤 10분 안의 cd $(git rev-parse --show-toplevel), ./gradlew build, python -c 같은 일상 명령도 묻는다.
  # 미탐 주의: 외부 입력 없이(사용자 요청만으로) 실행한 숨긴 명령, 10분 뒤, 다른 대화·하위 에이전트로 넘어간 경우.
  #   라벨이 없는 예전 센서에서는 걸리지 않는다.
  - id: unparsed-command-after-external-input
    severity: high
    category: prompt_injection
    title: 외부 입력 직후 내용을 읽을 수 없는 명령
    message: 외부(웹·외부 MCP·검색 등)에서 읽은 내용 직후 같은 대화에서 센서가 실행 내용을 해석할 수 없는 명령(동적 명령·명령 치환·스크립트·인라인 코드 등)이 실행되려 해 사용자 승인을 받습니다.
    recommended_action: 승인됐다면 근거 이벤트의 외부 입력과 명령(labels.sga_act_unknown의 이유)을 함께 확인하세요. 스크립트라면 그 내용을 확인하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM01, owasp-llm:LLM06, scenario:F1]
    match:
      type: sequence
      within_seconds: 600
      steps:
        - name: external-input
          when: {payload.kind: tool.result}
          fields: [labels.sga_input_source]
          # destructive-after-external-input의 외부 판정과 같게 유지
          pattern: '(?:^|,)(?!(?:local|mcp:(?:testdb|reports|crm)|file:[^,]*|[^,]*\.corp\.internal)(?:,|$))[^,]+'
        - name: unreadable-command
          when: {payload.kind: tool.call}
          fields: [labels.sga_act_unknown]
          pattern: '(?:^|,)(?:dynamic-command|dynamic-shell|eval|command-substitution|process-substitution|heredoc-expansion|env-split-string|ansi-c-quote|shell-reads-stdin|git-config|git-config-env|script:[^,]*|inline:[^,]*)(?=,|$)'

  # ── 후속 시나리오 ②: 임시 경로에 받은 파일 실행 (docs/downloaded-exec.md, 2026-11-14) ──
  # 출처: 센서가 내려받기 명령(curl -o/-O, wget -O/-P, Invoke-WebRequest -OutFile, git clone)에서 경로와 출처 호스트를
  #   기억했다가, 그 경로(또는 그 아래)를 실행하는 셸 호출에 labels.sga_runs_downloaded = "<호스트> <경로>"를 붙인다.
  #   에이전트가 붙인 같은 이름 라벨은 지운다. 임시 경로인지, 외부 출처인지는 이 룰이 정한다.
  # 결정(2026-11-14 승인 원칙): 공격 진행 신호·외부 유출이 아니므로 사용자 승인 + 보안팀 사후 검토. critical로 따로 기록.
  #   인젝션 문구 뒤의 내려받기는 injection-then-sensitive-action이 이미 차단한다(2단계에 curl·wget 포함).
  # 미탐 주의: 변수로 만든 경로(F=/tmp/x; bash $F), 다른 도구로 받은 파일(python으로 받기, 브라우저), 압축을 푼 뒤의 실행 파일,
  #   센서 재시작 전의 내려받기는 연결되지 않는다. 오탐 주의: 사내 목록에 없는 신뢰할 만한 설치 스크립트도 묻는다.
  - id: run-downloaded-file
    severity: critical
    category: tool_misuse
    title: 임시 경로·다운로드 폴더에 내려받은 파일 실행
    message: 외부에서 임시 경로나 다운로드 폴더로 내려받은 파일을 실행하려 해 사용자 승인을 받습니다.
    recommended_action: 사용자가 승인했다면 보안팀 검토 큐에서 내려받은 곳(라벨의 호스트)과 파일을 확인하세요. 처음 보는 곳이면 그 PC의 실행 흔적을 조사하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06, scenario:F2]
    when: {payload.kind: tool.call}
    match:
      type: regex
      fields: [labels.sga_runs_downloaded]
      # "<호스트> <경로>": 호스트가 사내(*.corp.internal)가 아니고 경로가 임시 경로 또는 다운로드 폴더(결정 2026-11-14)
      pattern: '(?i)^(?![^ ]*\.corp\.internal )\S+ (?:/tmp/|/var/tmp/|/private/tmp/|/private/var/folders/|/dev/shm/|\$TMPDIR|\$\{TMPDIR|%TEMP%|%TMP%|\$env:TEMP|\$env:TMP|.*[\\/]AppData[\\/]Local[\\/]Temp[\\/]|(?:~|\$HOME|\$\{HOME\}|%USERPROFILE%|\$env:USERPROFILE|/Users/[^/]+|/home/[^/]+|[a-z]:\\Users\\[^\\]+)[\\/]Downloads[\\/])'

  # 파일을 남기지 않고 내려받은 것을 바로 실행. 상태가 필요 없어 데몬 없이(hook 단독)도 잡힌다.
  # 오탐 주의: 공식 설치 스크립트(rustup, Homebrew 등)도 묻는다(의도: 공급망 경로). 미탐 주의: 내려받은 뒤 다른 명령에서 실행은 위 룰.
  - id: pipe-download-to-shell
    severity: high
    category: tool_misuse
    title: 내려받은 스크립트를 바로 실행
    message: 인터넷에서 받은 스크립트를 파일 확인 없이 셸·인터프리터로 바로 실행하려 해 사용자 승인을 받습니다.
    recommended_action: 사용자가 승인했다면 보안팀 검토 큐에서 스크립트 주소를 확인하세요.
    response: require_approval
    tags: ["grade:3-1", owasp-llm:LLM06, scenario:F2]
    when: {payload.kind: tool.call}
    match:
      type: regex
      ignore_case: true
      fields: [payload.arguments.command, payload.arguments.cmd]
      pattern: >-
        (?x)\b(?:curl|wget|fetch)\b[^|;&]*\|\s*(?:sudo\s+(?:-\S+\s+)*)?(?:ba|z|da|k|fi)?sh\b
        |\b(?:curl|wget)\b[^|;&]*\|\s*(?:sudo\s+)?(?:python[0-9.]*|node|perl|ruby|php)\s*(?:-\s*)?(?:$|;|&|\|)
        |\b(?:ba|z|da|k)?sh\s+(?:-\S+\s+)*["']?\$\(\s*(?:curl|wget)\b
        |\b(?:ba|z|da|k)?sh\s+<\(\s*(?:curl|wget)\b|\bsource\s+<\(\s*(?:curl|wget)\b
        |\b(?:iwr|irm|invoke-webrequest|invoke-restmethod)\b[^|;]*\|\s*(?:iex|invoke-expression)\b
        |\b(?:iex|invoke-expression)\b[^;]*(?:\b(?:iwr|irm|invoke-webrequest|invoke-restmethod)\b|downloadstring)

  # T15 (docs/incidents.md: Nx s1ngularity). 센서가 session.start에 실행 방식을 담아야 동작한다 (M6~).
  # 오탐 주의: 샌드박스·컨테이너에서 일부러 권한 확인을 끄는 개발자도 있다. 그래서 alert.
  - id: agent-safety-bypass
    severity: medium
    category: policy_violation
    title: 권한 확인을 끈 에이전트 실행
    message: 에이전트가 툴 실행 전 사용자 확인을 끈 모드로 시작했습니다.
    recommended_action: 격리된 환경인지 확인하세요. 일반 업무 PC라면 기본 모드를 쓰도록 안내하세요.
    response: alert
    tags: [owasp-llm:LLM06, incident:nx-s1ngularity-2025]
    when: {payload.kind: session.start}
    match:
      type: regex
      ignore_case: true
      fields: [payload.permission_mode]
      pattern: 'bypass|yolo|dangerous|full-auto|trust-all'

  # 사람이 없는데 확인까지 꺼졌다면 다른 프로그램이 에이전트를 부리는 것일 수 있다.
  # 오탐 주의: CI에서 claude -p 등을 이렇게 돌리는 정상 사용이 있다. 그룹별 예외는 M9 정책에서.
  - id: agent-unattended-safety-bypass
    severity: critical
    category: policy_violation
    title: 사람 없이 권한 확인을 끈 에이전트 실행
    message: 터미널에 사람이 없는 상태로, 툴 실행 확인을 끈 에이전트가 시작됐습니다. 악성코드가 에이전트를 대신 실행하는 패턴입니다.
    recommended_action: 부모 프로세스(parent_process)를 확인하세요. CI가 아니라면 세션을 중단하고 장비를 점검하세요.
    response: abort_session
    tags: [owasp-llm:LLM06, incident:nx-s1ngularity-2025]
    when: {payload.kind: session.start, payload.interactive: "false"}
    match:
      type: regex
      ignore_case: true
      fields: [payload.permission_mode]
      pattern: 'bypass|yolo|dangerous|full-auto|trust-all'

  # T15를 실행 직전에 막는다. 위 두 룰은 session.start를 보는데, Claude Code의 SessionStart는 막을 수 없고
  # 입력에 permission_mode도 없다(2026-11-15 확인. hook이 실행 플래그로 채우지만 설정 defaultMode로 켠 경우는 못 본다).
  # PreToolUse에는 Claude Code가 permission_mode를 넣고, hook이 실행 방식(CLAUDE_CODE_SESSION_ATTENDED,
  # CLAUDE_CODE_ENTRYPOINT)을 sga_attended로 붙인다. 사람이 없으니 승인받을 사람도 없다 → 읽기까지 모든 툴 호출 차단.
  # 오탐 주의: CI·자동화에서 claude -p --dangerously-skip-permissions를 쓰는 정상 사용도 막힌다. 그런 장비·그룹은
  #   M9 정책 예외로 푼다. auto 모드(분류기가 판단)와 정보가 없는 경우(sga_attended 없음)는 걸지 않는다.
  # 미탐 주의: 악성 프로그램이 claude를 띄우며 CLAUDE_CODE_SESSION_ATTENDED=1을 미리 넣으면 사람이 있는 것으로 보인다
  #   (Claude Code가 그 값을 덮어쓰는지 확인 못 함). 그 경우 session.start의 parent_process로 사후 확인한다.
  - id: agent-unattended-bypass-tool-call
    severity: critical
    category: policy_violation
    title: 사람 없이 권한 확인을 끈 에이전트의 툴 호출
    message: 터미널에 사람이 없는 상태에서 툴 실행 확인을 끈 에이전트가 툴을 실행하려 해 차단했습니다. 악성코드가 에이전트를 대신 실행하는 패턴입니다.
    recommended_action: 이 대화를 시작한 프로세스(session.start의 parent_process)를 확인하세요. CI가 아니라면 장비를 점검하세요.
    response: block
    tags: ["action-independent", owasp-llm:LLM06, incident:nx-s1ngularity-2025]
    when: {payload.kind: tool.call, labels.sga_attended: "false"}
    match:
      type: regex
      fields: [labels.sga_permission_mode]
      pattern: '^bypassPermissions$'

  # M5c. 게이트웨이 플러그인(before_tool_call)이 동작 중인데 판정 기록 없이 실행된 툴 호출.
  # 센서의 WebSocket 어댑터가 플러그인이 최근에 연결된 동안에만 라벨을 붙인다(docs/sensor.md).
  # 오탐 주의: 플러그인이 다루지 않는 실행 경로(예: Codex 네이티브 툴 중 hook 릴레이가 없는 것)도 걸린다.
  #   그런 경로를 확인하면 이 룰을 끄지 말고 원인을 고친다 — 그것 자체가 통제 공백이다.
  # 집행: WS 어댑터는 v4에서 막을 수 없으므로 alert. 보안팀이 플러그인 상태를 확인한다.
  - id: openclaw-plugin-bypass
    severity: high
    category: policy_violation
    title: 게이트웨이 플러그인을 거치지 않은 툴 실행
    message: 실행 전 판정 플러그인이 동작 중인데, 플러그인 판정 기록이 없는 툴 호출이 실행됐습니다.
    recommended_action: OpenClaw 플러그인이 꺼졌거나 우회됐는지 확인하세요(`openclaw plugins inspect sg-advance`). 해당 세션의 실행 내역을 검토하세요.
    response: alert
    tags: ["action-independent", owasp-llm:LLM06]
    when: {payload.kind: tool.call, labels.sga_plugin: missing}
    match:
      type: regex
      fields: [labels.sga_plugin]
      pattern: '^missing$'

  # M5c. 플러그인이 정기 신호(60초마다)를 보내다 끊겼다. 센서 데몬이 150초 넘게 신호를 못 받으면 낸다.
  # 플러그인이 꺼졌거나 게이트웨이가 플러그인 없이 재시작됐을 수 있다 → 이후 툴 호출은 실행 전 판정 없이 돈다.
  # 오탐 주의: 게이트웨이를 정상적으로 내린 경우에도 걸린다(그때는 툴 호출도 없으므로 바로 확인 가능).
  #   호스트 잠자기(Mac 덮개 닫기)는 데몬이 잠든 시간을 빼고 세므로 걸리지 않는다(docs/sensor.md 플러그인 신호 감시).
  - id: openclaw-plugin-heartbeat-lost
    severity: high
    category: policy_violation
    title: 게이트웨이 플러그인 신호 끊김
    message: 실행 전 판정 플러그인의 정기 신호가 끊겼습니다. 이후 툴 호출이 판정 없이 실행될 수 있습니다.
    recommended_action: 게이트웨이와 플러그인 상태를 확인하세요(`openclaw plugins list`, `openclaw gateway status`). 의도하지 않은 비활성화라면 해당 장비를 점검하세요.
    response: alert
    tags: [owasp-llm:LLM06]
    when: {payload.kind: sensor.health, payload.component: openclaw_plugin, payload.status: lost}
    match:
      type: regex
      fields: [payload.status]
      pattern: '^lost$'
