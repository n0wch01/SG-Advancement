# 비관리(섀도) 에이전트 설치 (M5d): 센서의 설치 탐지가 보내는 install.snapshot(설치 하나당 이벤트 하나).
# 관리됨 = 설정되어 있고 + SG-Advance 플러그인이 켜져 있고 + 이 장비의 센서가 그 설정과 게이트웨이를 본다.
# 결정(2026-11-12, 사용자 확정: 세 가지 모두 추천안):
#   - 대응은 알림만. 직원 PC의 개인 설치는 막는 대상이 아니라 탐지·관리 대상이다(로드맵 방향).
#   - 관리됨의 기준에 버전 승인은 넣지 않는다. 관리되는 설치는 무결성 검사가 버전을 본다(openclaw-version-unapproved).
#   - 수집은 OpenClaw 자신의 흔적만(실행 파일, 상태 폴더, 서비스 파일, 127.0.0.1의 게이트웨이 포트). 프로세스 목록 전체는 보지 않는다.
# install.snapshot은 처음 볼 때와 상태가 바뀔 때만 오므로 dedup: none.
# 비관리 경보는 관리 상태가 바뀐 스냅샷에서만 낸다(changed에 present·configured·managed). 처음 본 설치는 changed: [present].
#   2026-11-13 수정: 전에는 running이 바뀔 때마다(게이트웨이 재시작) 같은 경보가 다시 났다.
# 정규식은 문자열만 보므로 불리언 조건(managed 등)은 when에 둔다.
version: 1
rules:
  # 미탐 주의: 설정한 적 없는(configured=false) 설치는 경보하지 않는다(같은 이미지를 쓰는 컨테이너처럼 코드만 있는 경우).
  #   처음 실행하면 설정 파일이 생기므로 그때 걸린다. 현재 사용자 홈만 보므로 다른 계정의 설치는 안 보인다.
  # 오탐 주의: 센서를 아직 붙이지 않은 회사 승인 설치(설치 직후)도 걸린다.
  - id: openclaw-unmanaged-install
    severity: medium
    category: policy_violation
    title: 회사 관리 밖의 OpenClaw 설치
    message: 이 장비에 SG-Advance 통제(실행 전 판정 플러그인, 센서 감시) 없이 설정된 OpenClaw가 있습니다. 이 설치의 툴 실행은 판정·기록되지 않습니다.
    recommended_action: 사용자에게 확인한 뒤 회사 팀 게이트웨이를 쓰게 하거나, `openclaw plugins install sg-advance`와 `sga-sensor run --openclaw`로 관리 대상으로 등록하세요.
    response: alert
    dedup: none
    tags: [owasp-llm:LLM06, owasp-agentic:ASI03]
    when:
      payload.kind: install.snapshot
      payload.present: "true"
      payload.configured: "true"
      payload.managed: "false"
      "payload.changed[]": [present, configured, managed]   # 재시작(running만 바뀜)은 다시 경보하지 않음
    match:
      type: regex
      fields: [payload.product]
      pattern: '^openclaw$'

  # gateway.bind가 loopback이 아니면(lan, tailnet, custom 등) 같은 망에서 게이트웨이에 붙을 수 있다.
  # v4 게이트웨이는 공용 토큰이면 요청한 권한을 그대로 준다(T20). 관리되는 설치(팀 게이트웨이)는 의도된 구성이라 뺀다.
  # 미탐 주의: 실행 중(running)일 때만 본다. 꺼져 있다가 나중에 켜지면 그때 상태 변화로 다시 온다.
  - id: openclaw-gateway-network-exposed
    severity: high
    category: policy_violation
    title: 비관리 OpenClaw 게이트웨이가 네트워크에 열림
    message: 회사 관리 밖의 OpenClaw 게이트웨이가 루프백이 아닌 주소로 열려 있습니다. 토큰이 새면 같은 네트워크에서 에이전트를 전권으로 조작할 수 있습니다.
    recommended_action: gateway.bind를 loopback으로 바꾸게 하고, 게이트웨이 토큰을 교체하세요.
    response: alert
    dedup: none
    tags: [owasp-llm:LLM06]
    when: {payload.kind: install.snapshot, payload.present: "true", payload.running: "true", payload.managed: "false"}
    match:
      type: regex
      fields: [payload.bind_scope]
      pattern: '^network$'
