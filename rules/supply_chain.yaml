# 공급망: 미허가 플러그인 / MCP 서버, 툴 설명 변조(tool poisoning)
# SG S1(악성 플러그인)을 일반화. 허용목록은 M9에서 중앙 정책으로 옮겨간다.
version: 1
rules:
  - id: unapproved-plugin-installed
    severity: high
    category: supply_chain
    title: 미허가 플러그인 설치 감지
    message: 에이전트 인벤토리에 허용목록에 없는 플러그인이 나타났습니다.
    recommended_action: 플러그인 출처를 확인하고, 승인되지 않았다면 비활성화(quarantine)하세요.
    response: quarantine
    tags: [owasp-llm:LLM03, scenario:S1]
    when: {payload.kind: inventory.snapshot}
    match:
      type: allowlist
      field: payload.plugins[].plugin_id
      allow: []           # 승인된 plugin_id를 추가 (glob 가능: "corp-*")
      # + 센서가 무결성 검증한 플러그인: 설치된 파일이 서명된 배포본과 같고 그 버전이 approved/trusted
      # (OpenClaw 기본 제공 플러그인 오탐 해소, M5d). 이름만 같은 다른 코드는 여전히 걸린다.
      allow_trusted: openclaw_plugins

  - id: unapproved-plugin-tool-call
    severity: high
    category: supply_chain
    title: 미허가 플러그인 툴 호출
    message: 허용목록에 없는 플러그인이 제공하는 툴이 호출됐습니다.
    recommended_action: 호출을 차단하고 해당 플러그인을 격리하세요.
    response: block
    tags: [owasp-llm:LLM03, scenario:S1]
    when: {payload.kind: tool.call, payload.provider.kind: plugin}
    match:
      type: allowlist
      field: payload.provider.plugin_id
      allow: []
      allow_trusted: openclaw_plugins

  - id: unapproved-mcp-server-url
    severity: high
    category: supply_chain
    title: 미허가 MCP 서버 연결
    message: 허용되지 않은 주소의 MCP 서버가 툴을 제공하고 있습니다.
    recommended_action: MCP 서버 설정을 확인하고 승인되지 않은 서버를 제거하세요.
    response: quarantine
    tags: [owasp-agentic:T2, scenario:S1]
    when: {payload.kind: inventory.snapshot}
    match:
      type: allowlist
      field: payload.tools[].provider.mcp_server_url
      allow:
        - "http://localhost*"
        - "http://127.0.0.1*"
        - "http://*.corp-net/*"     # 데모용 사내망 (docker compose corp-net)

  - id: unapproved-mcp-tool-call
    severity: medium
    category: supply_chain
    title: 허용목록에 없는 MCP 서버의 툴 호출
    message: 허용목록에 없는 이름의 MCP 서버 툴이 호출됐습니다.
    recommended_action: 해당 MCP 서버가 승인된 것인지 확인하세요.
    response: alert
    tags: [owasp-agentic:T2]
    when: {payload.kind: tool.call, payload.provider.kind: mcp}
    match:
      type: allowlist
      field: payload.provider.mcp_server
      allow: [filesystem, github]   # 예시. 이름은 위조 가능하므로 URL 룰과 함께 쓴다.

  - id: mcp-tool-description-poisoning
    severity: critical
    category: supply_chain
    title: 툴 설명 변조(Tool Poisoning) 의심
    message: 툴 설명에 모델에게 내리는 숨은 지시나 민감 경로가 포함돼 있습니다.
    recommended_action: 해당 MCP 서버/플러그인을 즉시 격리하고 툴 설명 원문을 검토하세요.
    response: quarantine
    tags: [owasp-llm:LLM01, owasp-agentic:T2]
    when: {payload.kind: inventory.snapshot}
    match:
      type: regex
      fields: ["payload.tools[].description"]   # [] 가 들어간 경로는 따옴표 필수
      ignore_case: true
      pattern: '<important>|<system>|before using this tool|ignore (all )?previous|do not (tell|mention|inform)|~/\.ssh|id_rsa|\.aws/credentials|(^|[^\w.])\.env\b'

  # ── 설치된 코드 무결성 (M5d) ──
  # integrity.report: 센서가 설치된 파일의 해시를 정책의 매니페스트(서버가 npm 레지스트리 서명과
  # Sigstore 출처로 검증한 배포본의 해시)와 비교한 결과. 보고는 바뀔 때만 오므로 dedup: none.
  # 결정(2026-11-11): 변조(해시 불일치)만 격리, 나머지는 알림.
  - id: openclaw-plugin-tampered
    severity: critical
    category: supply_chain
    title: 변조된 OpenClaw 플러그인
    message: 설치된 플러그인 파일이 서명된 배포본과 다릅니다(파일이 수정·추가됐거나 패키지에 없는 플러그인이 끼어 있음).
    recommended_action: 해당 장비를 조사하세요. 센서가 플러그인을 비활성화했다면 원인 확인 전까지 다시 켜지 마세요.
    response: quarantine
    dedup: none
    tags: [owasp-llm:LLM03]
    when: {payload.kind: integrity.report}
    match:
      type: regex
      fields:
        - payload.plugins[].integrity
      pattern: '^mismatch$'

  # 본체는 센서가 끌 수 없다(게이트웨이 자체). 알림만.
  - id: openclaw-core-tampered
    severity: critical
    category: supply_chain
    title: 변조된 OpenClaw 본체
    message: 설치된 OpenClaw 본체 파일이 서명된 배포본과 다릅니다. 출처 표시를 포함해 OpenClaw가 보고하는 값을 믿을 수 없습니다.
    recommended_action: 게이트웨이를 멈추고 장비를 조사한 뒤 OpenClaw를 공식 배포본으로 다시 설치하세요.
    response: alert
    dedup: none
    tags: [owasp-llm:LLM03]
    when: {payload.kind: integrity.report}
    match:
      type: regex
      fields: [payload.core.integrity]
      pattern: '^mismatch$'

  # cooling: 서명·출처는 확인됐지만 출시 3일 미만 / unverified: 아직 검증 전 / rejected: 서명·출처 검증 실패
  # revoked: 보안팀이 철회. 오탐 주의: 업데이트 직후 한 번씩 걸린다(보안팀 승인 또는 3일 경과로 해소).
  - id: openclaw-version-unapproved
    severity: medium
    category: supply_chain
    title: 승인되지 않은 OpenClaw 버전
    message: 이 장비의 OpenClaw 버전이 아직 승인되지 않았거나(검증 중·출시 직후) 검증에 실패했습니다.
    recommended_action: "`sga-server manifest list`로 상태를 확인하고, 문제없으면 `sga-server manifest approve openclaw@<버전>`."
    response: alert
    dedup: session
    tags: [owasp-llm:LLM03]
    when: {payload.kind: integrity.report}
    match:
      type: allowlist
      field: payload.core.trust
      allow: [approved, trusted]
