# 자원 남용 / Denial of Wallet (SG S3 api_abuse.yaml에서 이전)
version: 1
rules:
  - id: rate-limit-tool-calls
    version: "2"
    severity: high
    category: resource_abuse
    title: 동일 도구 고빈도 호출 (Rate Limit)
    message: 짧은 시간 안에 같은 도구를 반복 호출하고 있습니다. Denial of Wallet의 초기 신호입니다.
    recommended_action: 세션을 중단하고 프롬프트를 검토하세요. 도구별 최대 호출 횟수를 시스템 프롬프트에 명시하세요.
    response: abort_session
    tags: ["action-independent", owasp-llm:LLM10, scenario:S3]
    when: {payload.kind: tool.call}
    # 오탐 수정(2026-11-18, 실제 Claude Code 대표 시나리오, 사용자 결정): 코딩 에이전트는 아래 룰이 30번에서 본다.
    unless: {agent.type: [claude_code, codex_cli]}
    match:
      type: rate
      window_seconds: 60
      threshold: 5          # 60초 안에 5번째 호출에서 발화
      # group_by 기본값: [endpoint.device_id, agent.session_id, payload.tool]
      # 사용자 단위로 보려면: [principal.user_id, payload.tool]

  - id: rate-limit-coding-agent-calls
    severity: high
    category: resource_abuse
    title: 코딩 에이전트의 동일 도구 폭주
    message: 코딩 에이전트가 1분 동안 같은 도구를 2초에 한 번꼴로 계속 호출하고 있습니다. 사람·모델 속도로 하는 작업이 아니라 폭주 신호입니다.
    recommended_action: 세션을 중단하고 프롬프트와 직전 도구 결과를 검토하세요.
    response: abort_session
    tags: ["action-independent", owasp-llm:LLM10, scenario:S3]
    # 2026-11-18 사용자 결정: 여러 단계 개발 작업은 1분에 셸 호출 5번을 쉽게 넘는다(실제 Claude Code 25초에 5번).
    # 미탐: 1분에 30번 미만으로 서로 다른 명령을 계속 내는 폭주는 멈추지 않는다(같은 인자 반복은 identical-args-loop).
    when: {payload.kind: tool.call, agent.type: [claude_code, codex_cli]}
    match:
      type: rate
      window_seconds: 60
      threshold: 30         # 60초 안에 30번째 호출에서 발화

  - id: identical-args-loop
    severity: critical
    category: resource_abuse
    title: 동일 인자 반복 호출 (무한 루프)
    message: 같은 도구를 같은 인자로 연속 호출합니다. 종료 조건 없는 루프 패턴입니다.
    recommended_action: 세션을 중단하고 종료 조건과 최대 반복 횟수를 추가하세요.
    response: abort_session
    tags: ["action-independent", owasp-llm:LLM10, scenario:S3]
    when: {payload.kind: tool.call}
    # 오탐 수정(2026-11-14, 운영 기록, 사용자 결정): 상태만 읽는 툴(목표·세션 상태 조회)의 반복은 폭주가 아니다.
    #   팀 게이트웨이 에이전트가 get_goal을 반복해 세션이 중단됐다. 미탐 주의: 이 툴들로 도는 루프는 rate-limit-tool-calls만 본다.
    unless: {payload.tool: [get_goal, session_status, sessions_list, sessions_history, agents_list, TodoRead]}
    match:
      type: repeat
      threshold: 5
      same: [payload.tool, payload.arguments]

  - id: exhaustion-keyword-prompt
    severity: medium
    category: resource_abuse
    title: 자원 고갈 유도 키워드
    message: 프롬프트에 종료 조건이 없는 반복 지시("완벽할 때까지", "계속 재시도" 등)가 있습니다.
    recommended_action: 반복 조건을 명시적으로 제한하세요(최대 N회, 결과 동일 시 중단 등).
    tags: [owasp-llm:LLM10, scenario:S3]
    when: {payload.kind: prompt.user}
    match:
      type: regex
      fields: [payload.text]
      ignore_case: true
      pattern: '(반복해|완벽할 때까지|완벽히.*때까지|멈추지 말고|계속 진행해|계속 해|무한(히|으로|루프)?|endless|infinite[ _-]?loop|retry[ _-]?forever|keep[ _-]?trying|재시도|다시 시도)'
