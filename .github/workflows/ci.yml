name: CI

on:
  push:
  pull_request:

# Actions are pinned to full commit SHAs (a moved tag cannot swap the code we run); the comment
# names the release. Bump both together.
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
      # Node runs the OpenClaw plugin's tests and the plugin<->daemon test in pytest
      # (TypeScript type stripping needs Node >= 22.18).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      - run: uv sync
      - run: uvx ruff check .
      - run: uv run python scripts/export_schema.py --check
      - run: node --test integrations/openclaw-plugin/policy.test.ts
      - run: uv run pytest

  dashboard:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
      # Exact versions from package-lock.json; install scripts stay off (dashboard/.npmrc).
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build
