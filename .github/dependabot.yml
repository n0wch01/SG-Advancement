# Keeps the SHA-pinned actions in .github/workflows current: Dependabot opens a PR that bumps the
# commit SHA and its version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Chore"
