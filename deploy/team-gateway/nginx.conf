# Demo identity proxy for the team gateway: one port per employee, each stamping who they are.
# In a company this is Cloudflare Access / an SSO-aware proxy; the gateway trusts only this IP.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream team_gateway {
    server 172.28.0.20:18789;  # fixed IP on team-net: no DNS lookup at proxy start
}

# WebSockets (where approvals and aborts travel) go through the SG-Advance audit proxy, which
# records who acted; plain HTTP (the Control UI's files) goes straight to the gateway.
upstream team_audit {
    server 172.28.0.11:18790;
}

map $http_upgrade $team_backend {
    default        team_gateway;
    ~*^websocket$  team_audit;
}

# Shared settings for every employee port. Client-supplied identity headers are overwritten.
# (included per server below)
server {
    listen 18801;
    location / {
        proxy_set_header x-forwarded-user alice@corp.test;
        include /etc/nginx/team-proxy-common.conf;
    }
}
server {
    listen 18802;
    location / {
        proxy_set_header x-forwarded-user bob@corp.test;
        include /etc/nginx/team-proxy-common.conf;
    }
}
server {
    listen 18803;
    location / {
        proxy_set_header x-forwarded-user carol@corp.test;
        include /etc/nginx/team-proxy-common.conf;
    }
}
server {
    listen 18804;
    location / {
        proxy_set_header x-forwarded-user secops@corp.test;
        include /etc/nginx/team-proxy-common.conf;
    }
}
