# Demo topology (docs/architecture.md).
# Endpoints (M4~) join corp-net; attacker services (M8~) live on internet-sim.
# The team gateway (M5b) is opt-in: `docker compose --profile team up -d` (docs/team-gateway.md).
name: sg-advance

services:
  control-plane:
    build:
      context: .
      dockerfile: deploy/control-plane.Dockerfile
    environment:
      SGA_ADMIN_TOKEN: ${SGA_ADMIN_TOKEN:?set SGA_ADMIN_TOKEN in .env}
      # SGA-Dashboard (M7): read-only login token; the built console (cd dashboard && npm run build).
      SGA_DASHBOARD_TOKEN: ${SGA_DASHBOARD_TOKEN:-}
      SGA_DASHBOARD_DIR: /opt/sga-dashboard
      # M12: shared with lan-gateway; its client-certificate headers count only with this secret.
      SGA_PROXY_SECRET: ${SGA_PROXY_SECRET:-}
      # What other PCs dial (install command, installer). SGA_LAN_HOST = this machine's LAN IP.
      SGA_LAN_URL: ${SGA_LAN_HOST:+https://${SGA_LAN_HOST}:${SGA_LAN_TLS_PORT:-18443}}
      SGA_INSTALL_URL: ${SGA_LAN_HOST:+http://${SGA_LAN_HOST}:${SGA_LAN_INSTALL_PORT:-18080}}
    volumes:
      - control-plane-data:/data
      - ./dashboard/dist:/opt/sga-dashboard:ro
      - lan-tls:/lan-tls  # `sga-server tls server-cert --out /lan-tls` writes the gateway's certificate
    ports:
      - "127.0.0.1:${SGA_PORT:-8000}:8000"
    networks: [corp-net, team-net]  # team-net: sensors on the isolated agent network report here
    restart: unless-stopped

  # Shared company OpenClaw gateway with the SG-Advance sensor and plugin installed (M5b).
  # Not published to the host: people reach it only through team-proxy, which stamps identity.
  team-gateway:
    profiles: [team]
    image: sg-advance-team-gateway:local  # also used by team-audit and team-egress
    build:
      context: .
      dockerfile: deploy/team-gateway/Dockerfile
    environment:
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_TEAM_PASSWORD:-}  # required: start.sh refuses to run without it
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_TEAM_ENROLL_TOKEN:-}
      # No direct route out (team-net is internal): everything external goes through team-egress.
      HTTP_PROXY: http://172.28.0.12:3128
      HTTPS_PROXY: http://172.28.0.12:3128
      http_proxy: http://172.28.0.12:3128
      https_proxy: http://172.28.0.12:3128
      NO_PROXY: localhost,127.0.0.1,control-plane,172.28.0.0/24
      no_proxy: localhost,127.0.0.1,control-plane,172.28.0.0/24
      NODE_USE_ENV_PROXY: "1"  # Node's fetch/http honour the variables above
    volumes:
      - team-openclaw:/home/node/.openclaw
      - team-sga:/home/node/.sg-advance
    networks:
      team-net:
        ipv4_address: 172.28.0.20
    depends_on: [control-plane, team-egress]
    restart: unless-stopped

  # SG-Advance audit proxy: WebSockets from team-proxy pass through here, so approvals and aborts
  # are recorded with the person (OpenClaw itself stores only the client app as the resolver).
  team-audit:
    profiles: [team]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/opt/sga/audit-start.sh"]
    healthcheck:
      disable: true  # the image's check probes the gateway port, which this container doesn't serve
    environment:
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_AUDIT_ENROLL_TOKEN:-}
    volumes:
      - team-audit:/home/node/.sg-advance
    networks:
      team-net:
        ipv4_address: 172.28.0.11
    depends_on: [team-gateway]
    restart: unless-stopped

  # SG-Advance egress proxy: the agent network's only way out. Every destination is judged by the
  # signed policy (egress-unapproved-host). SGA_EGRESS_MODE=monitor (default) records, enforce refuses.
  team-egress:
    profiles: [team]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/opt/sga/egress-start.sh"]
    healthcheck:
      disable: true
    environment:
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_EGRESS_ENROLL_TOKEN:-}
      SGA_EGRESS_MODE: ${SGA_EGRESS_MODE:-monitor}
    volumes:
      - team-egress:/home/node/.sg-advance
    networks:
      corp-net: {}  # the internet
      team-net:
        ipv4_address: 172.28.0.12
    depends_on: [control-plane]
    restart: unless-stopped

  # Demo employee PC with a personal OpenClaw install (M5d shadow AI): no SG-Advance plugin, its
  # gateway opened to the office LAN. The company sensor here only runs the install discovery scan.
  carol-pc:
    profiles: [shadow]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/opt/sga/pc-start.sh"]
    healthcheck:
      disable: true
    environment:
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_PC_ENROLL_TOKEN:-}
      SGA_DEVICE_ID: carol-pc
      SGA_DEFAULT_USER: carol@corp.test
      PC_GATEWAY_BIND: ${PC_GATEWAY_BIND:-lan}
    volumes:
      - carol-pc:/home/node
    networks:
      corp-net: {}  # the office LAN
    depends_on: [control-plane]
    restart: unless-stopped

  # Demo identity proxy (stand-in for Cloudflare Access / SSO): one host port per employee.
  team-proxy:
    profiles: [team]
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./deploy/team-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/team-gateway/team-proxy-common.conf:/etc/nginx/team-proxy-common.conf:ro
    ports:
      - "127.0.0.1:18801-18804:18801-18804"
    networks:
      team-edge: {}  # published ports need a non-internal network
      team-net:
        ipv4_address: 172.28.0.10
    depends_on: [team-gateway, team-audit]
    restart: unless-stopped

  # M12 LAN gateway: other PCs' sensors reach the control plane only here (mTLS with device
  # certificates; docs/multi-host.md). Opt-in: `docker compose --profile lan up -d`. Published on
  # the LAN (SGA_LAN_BIND, default all interfaces); admin API and dashboard are not reachable through it.
  # Zero trust (2026-11-13, profile mcp): the company's MCP servers sit on crm-net (internal, no
  # route anywhere); the central MCP gateway is the only thing on both sides. It holds corp-crm's token
  # (agents hold none) and accepts only requests the LAN gateway forwards (device mTLS + revocation
  # check per request, proxy secret). Employees' agents: https://<LAN>:18443/mcp/crm via their sensor.
  mcp-gateway:
    profiles: [mcp]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/opt/sga-mcp/start.sh"]
    healthcheck:
      disable: true
    environment:
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_MCP_ENROLL_TOKEN:-}
      CRM_TOKEN: ${SGA_CRM_TOKEN:-}
      SGA_PROXY_SECRET: ${SGA_PROXY_SECRET:-}
    volumes:
      - ./deploy/mcp-gateway/start.sh:/opt/sga-mcp/start.sh:ro
      - mcp-gateway:/home/node/.sg-advance
    networks: [corp-net, crm-net]  # corp-net: LAN gateway and control plane; crm-net: the servers
    depends_on: [control-plane]
    restart: unless-stopped

  # Demo company MCP server (CRM). Answers only with the token the central gateway holds.
  corp-crm:
    profiles: [mcp]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/usr/local/bin/python3.12", "/demo/fake_mcp_server.py",
                 "--host", "0.0.0.0", "--port", "18791", "--token-env", "CRM_TOKEN"]
    healthcheck:
      disable: true
    environment:
      CRM_TOKEN: ${SGA_CRM_TOKEN:-}
    volumes:
      - ./demo/fake_mcp_server.py:/demo/fake_mcp_server.py:ro
    networks: [crm-net]
    restart: unless-stopped

  lan-gateway:
    profiles: [lan]
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    environment:
      SGA_PROXY_SECRET: ${SGA_PROXY_SECRET:-}
    volumes:
      - ./deploy/lan-gateway/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - lan-tls:/etc/sga-tls:ro
    ports:
      - "${SGA_LAN_BIND:-0.0.0.0}:${SGA_LAN_TLS_PORT:-18443}:8443"
      - "${SGA_LAN_BIND:-0.0.0.0}:${SGA_LAN_INSTALL_PORT:-18080}:8080"
    networks: [corp-net]
    depends_on: [control-plane]
    restart: unless-stopped

networks:
  corp-net: {}
  internet-sim: {}
  team-edge: {}
  crm-net:
    internal: true  # company MCP servers: reachable only by the central MCP gateway
  team-net:
    internal: true  # the agent network: no route out except team-egress
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  control-plane-data: {}
  lan-tls: {}
  team-openclaw: {}
  team-sga: {}
  team-audit: {}
  team-egress: {}
  carol-pc: {}
  mcp-gateway: {}
