# Demo topology (docs/architecture.md). M3: control plane only.
# Endpoints (M4~) join corp-net; attacker services (M8~) live on internet-sim.
name: agent-sentinel

services:
  control-plane:
    build:
      context: .
      dockerfile: deploy/control-plane.Dockerfile
    environment:
      SENTINEL_ADMIN_TOKEN: ${SENTINEL_ADMIN_TOKEN:?set SENTINEL_ADMIN_TOKEN in .env}
    volumes:
      - control-plane-data:/data
    ports:
      - "127.0.0.1:${SENTINEL_PORT:-8000}:8000"
    networks: [corp-net]

networks:
  corp-net: {}
  internet-sim: {}

volumes:
  control-plane-data: {}
