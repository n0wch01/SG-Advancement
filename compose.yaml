# Demo topology (docs/architecture.md).
# Endpoints (M4~) join corp-net; attacker services (M8~) live on internet-sim.
# The team gateway (M5b) is opt-in: `docker compose --profile team up -d` (docs/team-gateway.md).
name: sg-advance

services:
  control-plane:
    build:
      context: .
      dockerfile: deploy/control-plane.Dockerfile
    environment:
      SGA_ADMIN_TOKEN: ${SGA_ADMIN_TOKEN:?set SGA_ADMIN_TOKEN in .env}
    volumes:
      - control-plane-data:/data
    ports:
      - "127.0.0.1:${SGA_PORT:-8000}:8000"
    networks: [corp-net, team-net]  # team-net: sensors on the isolated agent network report here
    restart: unless-stopped

  # Shared company OpenClaw gateway with the SG-Advance sensor and plugin installed (M5b).
  # Not published to the host: people reach it only through team-proxy, which stamps identity.
  team-gateway:
    profiles: [team]
    image: sg-advance-team-gateway:local  # also used by team-audit and team-egress
    build:
      context: .
      dockerfile: deploy/team-gateway/Dockerfile
    environment:
      OPENCLAW_GATEWAY_PASSWORD: ${OPENCLAW_TEAM_PASSWORD:-}  # required: start.sh refuses to run without it
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_TEAM_ENROLL_TOKEN:-}
      # No direct route out (team-net is internal): everything external goes through team-egress.
      HTTP_PROXY: http://172.28.0.12:3128
      HTTPS_PROXY: http://172.28.0.12:3128
      http_proxy: http://172.28.0.12:3128
      https_proxy: http://172.28.0.12:3128
      NO_PROXY: localhost,127.0.0.1,control-plane,172.28.0.0/24
      no_proxy: localhost,127.0.0.1,control-plane,172.28.0.0/24
      NODE_USE_ENV_PROXY: "1"  # Node's fetch/http honour the variables above
    volumes:
      - team-openclaw:/home/node/.openclaw
      - team-sga:/home/node/.sg-advance
    networks:
      team-net:
        ipv4_address: 172.28.0.20
    depends_on: [control-plane, team-egress]
    restart: unless-stopped

  # SG-Advance audit proxy: WebSockets from team-proxy pass through here, so approvals and aborts
  # are recorded with the person (OpenClaw itself stores only the client app as the resolver).
  team-audit:
    profiles: [team]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/opt/sga/audit-start.sh"]
    healthcheck:
      disable: true  # the image's check probes the gateway port, which this container doesn't serve
    environment:
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_AUDIT_ENROLL_TOKEN:-}
    volumes:
      - team-audit:/home/node/.sg-advance
    networks:
      team-net:
        ipv4_address: 172.28.0.11
    depends_on: [team-gateway]
    restart: unless-stopped

  # SG-Advance egress proxy: the agent network's only way out. Every destination is judged by the
  # signed policy (egress-unapproved-host). SGA_EGRESS_MODE=monitor (default) records, enforce refuses.
  team-egress:
    profiles: [team]
    image: sg-advance-team-gateway:local
    pull_policy: never
    entrypoint: ["tini", "-s", "--", "/opt/sga/egress-start.sh"]
    healthcheck:
      disable: true
    environment:
      SGA_SERVER: http://control-plane:8000
      SGA_ENROLL_TOKEN: ${SGA_EGRESS_ENROLL_TOKEN:-}
      SGA_EGRESS_MODE: ${SGA_EGRESS_MODE:-monitor}
    volumes:
      - team-egress:/home/node/.sg-advance
    networks:
      corp-net: {}  # the internet
      team-net:
        ipv4_address: 172.28.0.12
    depends_on: [control-plane]
    restart: unless-stopped

  # Demo identity proxy (stand-in for Cloudflare Access / SSO): one host port per employee.
  team-proxy:
    profiles: [team]
    image: nginx:1.29-alpine@sha256:5616878291a2eed594aee8db4dade5878cf7edcb475e59193904b198d9b830de
    volumes:
      - ./deploy/team-gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/team-gateway/team-proxy-common.conf:/etc/nginx/team-proxy-common.conf:ro
    ports:
      - "127.0.0.1:18801-18804:18801-18804"
    networks:
      team-edge: {}  # published ports need a non-internal network
      team-net:
        ipv4_address: 172.28.0.10
    depends_on: [team-gateway, team-audit]
    restart: unless-stopped

networks:
  corp-net: {}
  internet-sim: {}
  team-edge: {}
  team-net:
    internal: true  # the agent network: no route out except team-egress
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  control-plane-data: {}
  team-openclaw: {}
  team-sga: {}
  team-audit: {}
  team-egress: {}
