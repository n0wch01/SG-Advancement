[project]
name = "sg-advance"
version = "0.1.0"
description = "Central policy & threat control plane for heterogeneous AI agents (OpenClaw, Claude Code, MCP, LangGraph, Gemini CLI, Codex CLI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43",
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# OpenClaw gateway adapter (WebSocket). Only endpoints that run OpenClaw need it.
openclaw = [
    "websockets>=13",
]
# Control plane only. Endpoint sensors install the bare package and stay light.
server = [
    "alembic>=1.13",  # schema migrations (server/migrations)
    "fastapi>=0.115",
    "sigstore>=4.5",  # verifies npm provenance of agent packages (server/supply.py)
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
sga-detect = "sg_advance.detect.cli:main"
sga-server = "sg_advance.server.cli:main"
sga-sensor = "sg_advance.sensor.cli:main"

[dependency-groups]
dev = [
    "sg-advance[server,openclaw]",
    "httpx2>=2.16",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sg_advance"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo"]  # demo/ is optional; missing paths are skipped
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
