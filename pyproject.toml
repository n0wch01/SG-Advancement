[project]
name = "agent-sentinel"
version = "0.1.0"
description = "Central policy & threat control plane for heterogeneous AI agents (OpenClaw, Claude Code, MCP, LangGraph, Gemini CLI, Codex CLI)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Control plane only. Endpoint sensors install the bare package and stay light.
server = [
    "fastapi>=0.115",
    "sqlalchemy>=2.0",
    "uvicorn>=0.32",
]

[project.scripts]
sentinel-detect = "agent_sentinel.detect.cli:main"
sentinel-server = "agent_sentinel.server.cli:main"

[dependency-groups]
dev = [
    "agent-sentinel[server]",
    "httpx2>=2.16",
    "pytest>=8.3",
    "ruff>=0.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sentinel"]

[tool.pytest.ini_options]
testpaths = ["tests", "demo"]  # demo/ is optional; missing paths are skipped
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", "scripts", "demo"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
